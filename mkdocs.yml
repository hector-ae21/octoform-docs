site_name: Octoform
site_description: Declarative plan and apply governance for GitHub repositories
site_author: Hector Arrechea
site_url: https://hector-ae21.github.io/octoform-docs/
repo_name: hector-ae21/octoform-docs
repo_url: https://github.com/hector-ae21/octoform-docs
edit_uri: edit/v0.x/docs/
copyright: Copyright &copy; 2026 Hector Arrechea
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/brand/octoform-mark.png
  favicon: assets/brand/octoform-favicon.png
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - privacy
  - search:
      lang: en
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/navigation.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hector-ae21/octoform
      name: Octoform on GitHub
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@hector21/octoform
      name: Octoform on npm
  version:
    provider: mike
    default: latest

