      - Apply and verify: getting-started/safe-apply.md
      - Core concepts: concepts/index.md
  - Guides & examples:
      - Guides overview: guides/index.md
      - Plan and apply: guides/plan-and-apply.md
      - CI/CD automation: automation/index.md
      - Examples:
          - Example catalogue: examples/index.md
          - Minimal policy: examples/minimal.md
          - Audit only: examples/audit-only.md
          - Personal account: examples/personal-account.md
          - Branch patterns: examples/branch-patterns.md
