<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="872px" preserveAspectRatio="none" style="width:676px;height:872px;" version="1.1" viewBox="0 0 676 872" width="676px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="savePlan" data-source-line="3" id="ent0001"><path d="M13,7 L453,7 A6,6 0 0 1 459,13 L459,33.2969 L7,33.2969 L7,13 A6,6 0 0 1 13,7" fill="#10284A"/><path d="M7,33.2969 L459,33.2969 L459,692.2969 A6,6 0 0 1 453,698.2969 L13,698.2969 A6,6 0 0 1 7,692.2969 L7,33.2969" fill="#10284A"/><rect fill="none" height="691.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="452" x="7" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="459" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="73.4795" x="196.2603" y="24.9951">savePlan()</text><g class="entity" data-qualified-name="savePlan.RequestingArtifact" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="savePlan.Recording" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="346.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="372.5938" y2="372.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="364.292">&#160;</text></g><g class="entity" data-qualified-name="savePlan.HandingOver" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="527.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="553.5938" y2="553.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="545.292">&#160;</text></g><g class="start_entity" data-qualified-name="savePlan..start.savePlan" data-source-line="9" id="ent0005"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="savePlan..end.savePlan" data-source-line="34" id="ent0009"><ellipse cx="44" cy="674.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="674.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*savePlan to RequestingArtifact--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M44,64.6369 C44,82.8269 44,118.5369 44,144.9069" fill="none" id="*start*savePlan-to-RequestingArtifact" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,149.9069,48,140.9069,44,144.9069,40,140.9069,44,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,121.2969 A6,6 0 0 0 55,127.2969 L429,127.2969 A6,6 0 0 0 435,121.2969 L435,97.2969 L425,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M425,87.2969 L425,94.2969 A3,3 0 0 0 428,97.2969 L435,97.2969 L425,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="123.6841" x="55" y="104.3638">Change reviewer</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237.4087" x="182.8164" y="104.3638">asks for a plan that can be reviewed</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="279.0874" x="55" y="119.4966">now and carried out later by someone else</text></g><!--link RequestingArtifact to Recording--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.4769 C44,237.6469 44,303.4569 44,340.8169" fill="none" id="RequestingArtifact-to-Recording" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,345.8169,48,336.8169,44,340.8169,40,336.8169,44,345.8169" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,317.2969 A6,6 0 0 0 55,323.2969 L415,323.2969 A6,6 0 0 0 421,317.2969 L421,233.2969 L411,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M411,223.2969 L411,230.2969 A3,3 0 0 0 414,233.2969 L421,233.2969 L411,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="278.8779" x="127.5791" y="240.3638">plans as usual and records the identity the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.3501" x="55" y="255.4966">plan was produced under</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.8579" x="55" y="270.6294">&#8226; the authenticated actor</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="220.5303" x="55" y="285.7622">&#8226; each account's numeric identity</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.2896" x="55" y="300.895">&#8226; a digest of every configuration source file</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9351" x="55" y="316.0278">&#8226; a digest of the resolved configuration itself</text></g><!--link Recording to HandingOver--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="25" id="lnk8"><path d="M44,396.4369 C44,430.5969 44,487.6969 44,521.9669" fill="none" id="Recording-to-HandingOver" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,526.9669,48,517.9669,44,521.9669,40,517.9669,44,526.9669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,425.2969 L49,498.2969 A6,6 0 0 0 55,504.2969 L401,504.2969 A6,6 0 0 0 407,498.2969 L407,429.2969 L397,419.2969 L55,419.2969 A6,6 0 0 0 49,425.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M397,419.2969 L397,426.2969 A3,3 0 0 0 400,429.2969 L407,429.2969 L397,419.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="436.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="264.9512" x="127.5791" y="436.3638">writes the artifact and gives it an expiry,</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="128.0513" x="55" y="451.4966">one hour by default</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="158.5518" x="55" y="466.6294">&#8226; it carries no credential</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="290.5703" x="55" y="481.7622">&#8226; it does name private repositories and their</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.6938" x="63.2646" y="496.895">settings, so it is as sensitive as the configuration</text></g><!--link HandingOver to *end*savePlan--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="34" id="lnk10"><path d="M44,577.5769 C44,603.7469 44,639.1469 44,657.9769" fill="none" id="HandingOver-to-*end*savePlan" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,662.9769,48,653.9769,44,657.9769,40,653.9769,44,662.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,606.2969 L49,634.2969 A6,6 0 0 0 55,640.2969 L393,640.2969 A6,6 0 0 0 399,634.2969 L399,610.2969 L389,600.2969 L55,600.2969 A6,6 0 0 0 49,606.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M389,600.2969 L389,607.2969 A3,3 0 0 0 392,610.2969 L399,610.2969 L389,600.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="123.6841" x="55" y="617.3638">Change reviewer</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="201.665" x="182.8164" y="617.3638">reviews the file and hands it to</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="225.0054" x="55" y="632.4966">whoever, or whatever, will apply it</text></g></g><g class="entity" data-qualified-name="PLAN_SAVED" data-source-line="41" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="110.959" x="177.52" y="808.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="177.52" x2="288.479" y1="834.5969" y2="834.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="90.959" x="187.52" y="826.2951">PLAN_SAVED</text></g><!--link savePlan to PLAN_SAVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="de