<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="917px" preserveAspectRatio="none" style="width:578px;height:917px;" version="1.1" viewBox="0 0 578 917" width="578px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="inspectMembers" data-source-line="3" id="ent0001"><path d="M13,7 L450,7 A6,6 0 0 1 456,13 L456,33.2969 L7,33.2969 L7,13 A6,6 0 0 1 13,7" fill="#10284A"/><path d="M7,33.2969 L456,33.2969 L456,722.2969 A6,6 0 0 1 450,728.2969 L13,728.2969 A6,6 0 0 1 7,722.2969 L7,33.2969" fill="#10284A"/><rect fill="none" height="721.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="449" x="7" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="456" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="126.5469" x="168.2266" y="24.9951">inspectMembers()</text><g class="entity" data-qualified-name="inspectMembers.RequestingInventory" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="inspectMembers.Listing" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="331.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="357.5938" y2="357.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="349.292">&#160;</text></g><g class="entity" data-qualified-name="inspectMembers.Comparing" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="527.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="553.5938" y2="553.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="545.292">&#160;</text></g><g class="start_entity" data-qualified-name="inspectMembers..start.inspectMembers" data-source-line="9" id="ent0005"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="inspectMembers..end.inspectMembers" data-source-line="34" id="ent0009"><ellipse cx="44" cy="704.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="704.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*inspectMembers to RequestingInventory--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M44,64.6369 C44,82.8269 44,118.5369 44,144.9069" fill="none" id="*start*inspectMembers-to-RequestingInventory" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,149.9069,48,140.9069,44,144.9069,40,140.9069,44,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,121.2969 A6,6 0 0 0 55,127.2969 L406,127.2969 A6,6 0 0 0 412,121.2969 L412,97.2969 L402,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M402,87.2969 L402,94.2969 A3,3 0 0 0 405,97.2969 L412,97.2969 L402,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.8286" x="125.0464" y="104.3638">asks who is in the organisation, and</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="342.6655" x="55" y="119.4966">which of the people the configuration names are not</text></g><!--link RequestingInventory to Listing--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.4369 C44,234.5969 44,291.6969 44,325.9669" fill="none" id="RequestingInventory-to-Listing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,330.9669,48,321.9669,44,325.9669,40,321.9669,44,330.9669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,302.2969 A6,6 0 0 0 55,308.2969 L426,308.2969 A6,6 0 0 0 432,302.2969 L432,233.2969 L422,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M422,223.2969 L422,230.2969 A3,3 0 0 0 425,233.2969 L432,233.2969 L422,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.9546" x="127.5791" y="240.3638">reads the owners, the members, the outside</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="340.1392" x="55" y="255.4966">collaborators, and the invitations that are waiting or</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="66.5488" x="55" y="270.6294">that failed</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.646" x="55" y="285.7622">&#8226; a pending invitation carries its age in whole days</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.4502" x="55" y="300.895">&#8226; a failed one carries GitHub's own reason</text></g><!--link Listing to Comparing--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="24" id="lnk8"><path d="M44,381.4769 C44,418.6469 44,484.4569 44,521.8169" fill="none" id="Listing-to-Comparing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,526.8169,48,517.8169,44,521.8169,40,517.8169,44,526.8169" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,410.2969 L49,498.2969 A6,6 0 0 0 55,504.2969 L408,504.2969 A6,6 0 0 0 414,498.2969 L414,414.2969 L404,404.2969 L55,404.2969 A6,6 0 0 0 49,410.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M404,404.2969 L404,411.2969 A3,3 0 0 0 407,414.2969 L414,414.2969 L404,404.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="421.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="241.833" x="127.5791" y="421.3638">collects every login the configuration</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="344.3223" x="55" y="436.4966">names &#8212; team membership, role holders, repository</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.0381" x="55" y="451.6294">collaborators &#8212; and subtracts everyone the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.2324" x="55" y="466.7622">organisation already knows</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.5771" x="55" y="481.895">&#8226; an outside collaborator counts as known</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="290.0435" x="55" y="497.0278">&#8226; somebody already invited counts as asked</text></g><!--link Comparing to *end*inspectMembers--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="34" id="lnk10"><path d="M44,577.7269 C44,611.1069 44,664.4769 44,688.0169" fill="none" id="Comparing-to-*end*inspectMembers" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,693.0169,48,684.0169,44,688.0169,40,684.0169,44,693.0169" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,606.2969 L49,664.2969 A6,6 0 0 0 55,670.2969 L407,670.2969 A6,6 0 0 0 413,664.2969 L413,610.2969 L403,600.2969 L55,600.2969 A6,6 0 0 0 49,606.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M403,600.2969 L403,607.2969 A3,3 0 0 0 406,610.2969 L413,610.2969 L403,600.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="617.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="260.5713" x="125.0464" y="617.3638">receives the four listings, the two-factor</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="343.1099" x="55" y="632.4966">answer or the reason it is not visible, and the people</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="325.1016" x="55" y="647.6294">the configuration names who are in no part of the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="81.0088" x="55" y="662.7622">organisation</text></g></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="43" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="121.25" y="853.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="121.25" x2="341.7549" y1="879.5969" y2="879.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="131.25" y="871.2951">CONFIGURATION_RESOLVED</text></g><!--link inspectMembers to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="43" id="lnk12"><path d="M231.5,728.47 C231.5,781.42 231.5,821.95 231.5,848.25" fill="none" id="inspectMembers-to-CONFIGURATION_RESOLVED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="231.5,853.25,235.5,844.25,231.5,848.25,227.5,844.25,231.5,853.25" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M236.5,769.3 L236.5,812.3 A6,6 0 0 0 242.5,818.3 L557.5,818.3 A6,6 0 0 0 563.5,812.3 L563.5,773.3 L553.5,763.3 L242.5,763.3 A6,6 0 0 0 236.5,769.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M553.5,763.3 L553.5,770.3 A3,3 0 0 0 556.5,773.3 L563.5,773.3 L553.5,763.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="266.646" x="242.5" y="780.3669">read-only; nothing is invited, removed or</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="306.8394" x="242.5" y="795.4997">changed. A personal account has no members,</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="247.2983" x="242.5" y="810.6325">so the use case does not apply to one</text></g><?plantuml-src XPJRQXj138RlzodKtFH0d3v0Go2qQHf8OqWFDwM4sLtPEsHMsixCUZ6ba8Ve4_JHyYIHj3x49YKOZ7T7qkZxzSilF5MXhn5kSeCj7lc-3KMHiii8dbA7LVwCROanWKjmiFlgrUi3-5qK06FyWNmaw1f_zPYof_a5BP0on-L-oAMty_tNxxdjNDG3EVdnvYTC9YV_AKSiQKmGFDtAut5vCkqmEZazVbkUIB7R14F3u9DWWB01nxaZdr