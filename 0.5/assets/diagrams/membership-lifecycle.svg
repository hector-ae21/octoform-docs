<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="719px" preserveAspectRatio="none" style="width:1326px;height:719px;" version="1.1" viewBox="0 0 1326 719" width="1326px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="Unknown" data-source-line="3" id="ent0001"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="232.4678" x="419.7" y="138.4"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="419.7" x2="652.1678" y1="164.6969" y2="164.6969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="212.4678" x="429.7" y="156.3951">Not known to the organisation</text></g><g class="entity" data-qualified-name="Invited" data-source-line="4" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="128.124" x="551.87" y="315.4"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="551.87" x2="679.994" y1="341.6969" y2="341.6969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="108.124" x="561.87" y="333.3951">Invited, waiting</text></g><g class="entity" data-qualified-name="Failed" data-source-line="5" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="129.2998" x="806.28" y="460.23"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="806.28" x2="935.5798" y1="486.5269" y2="486.5269"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="109.2998" x="816.28" y="478.2251">Invitation failed</text></g><g class="entity" data-qualified-name="Member" data-source-line="6" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="77.5859" x="348.14" y="460.23"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="348.14" x2="425.7259" y1="486.5269" y2="486.5269"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="57.5859" x="358.14" y="478.2251">Member</text></g><g class="entity" data-qualified-name="Owner" data-source-line="7" id="ent0005"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="65.7119" x="142.08" y="8.7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="142.08" x2="207.7919" y1="34.9969" y2="34.9969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="45.7119" x="152.08" y="26.6951">Owner</text></g><g class="entity" data-qualified-name="Outside" data-source-line="8" id="ent0006"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="162.7344" x="687.57" y="655.06"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="687.57" x2="850.3044" y1="681.3569" y2="681.3569"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="142.7344" x="697.57" y="673.0551">Outside collaborator</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="10" id="ent0007"><ellipse cx="577.93" cy="33.7" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN19" data-source-line="40" id="ent0020"><path d="M242.96,12 L242.96,29.7 L208.22,33.7 L242.96,37.7 L242.96,55.3984 A6,6 0 0 0 248.96,61.3984 L526.9102,61.3984 A6,6 0 0 0 532.9102,55.3984 L532.9102,16 L522.9102,6 L248.96,6 A6,6 0 0 0 242.96,12" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M522.9102,6 L522.9102,13 A3,3 0 0 0 525.9102,16 L532.9102,16 L522.9102,6" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="219.1909" x="248.96" y="23.0669">Refused whatever else is true</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.1245" x="248.96" y="38.1997">&#8226; the only remaining owner</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.9502" x="248.96" y="53.3325">&#8226; the account the run is authenticated as</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="46" id="ent0023"><path d="M460.71,448.4 L460.71,522.0641 A6,6 0 0 0 466.71,528.0641 L765.1695,528.0641 A6,6 0 0 0 771.1695,522.0641 L771.1695,452.4 L761.1695,442.4 L619.93,442.4 L615.93,365.63 L611.93,442.4 L466.71,442.4 A6,6 0 0 0 460.71,448.4" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M761.1695,442.4 L761.1695,449.4 A3,3 0 0 0 764.1695,452.4 L771.1695,452.4 L761.1695,442.4" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="126.1978" x="466.71" y="459.4669">inspect members</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.1294" x="597.0401" y="459.4669">reports the age in whole</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.3965" x="466.71" y="474.5997">days, which is what makes a stale invitation</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.9116" x="466.71" y="489.7325">visible at all. A pending invitation counts as</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.6919" x="466.71" y="504.8653">somebody already asked, so no run sends a</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="78.8188" x="466.71" y="519.9981">second one.</text></g><!--link *start* to Unknown--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" data-link-type="dependency" data-source-line="10" id="lnk8"><path d="M575.05,43.47 C568.71,62.75 554.9528,104.5805 545.4728,133.3905" fill="none" id="*start*-to-Unknown" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="543.91,138.14,550.5227,130.8412,545.4728,133.3905,542.9235,128.3407,543.91,138.14" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Unknown to Invited--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="12" id="lnk9"><path d="M477.37,188.72 C465.6,196.42 454.76,206.2 447.93,218.4 C433.39,244.38 430.39,261.33 447.93,285.4 C454.45,294.34 502.3192,309.0634 546.9792,321.3534" fill="none" id="Unknown-to-Invited" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="551.8,322.68,544.1839,316.4354,546.9792,321.3534,542.0613,324.1487,551.8,322.68" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="102.0767" x="547.3206" y="231.4669">members invite</text><path d="M452.93,246.5328 L452.93,274.5328 A6,6 0 0 0 458.93,280.5328 L736.93,280.5328 A6,6 0 0 0 742.93,274.5328 L742.93,250.5328 L732.93,240.5328 L458.93,240.5328 A6,6 0 0 0 452.93,246.5328" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M732.93,240.5328 L732.93,247.5328 A3,3 0 0 0 735.93,250.5328 L742.93,250.5328 L732.93,240.5328" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="199.3228" x="458.93" y="257.5997">Command, not declaration.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="66.4028" x="662.3851" y="257.5997">One login,</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="247.5522" x="458.93" y="272.7325">confirmed, and the person is emailed.</text></g><!--link Invited to Unknown--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="20" id="lnk12"><path d="M680.39,330 C707.17,322.57 735.74,309.25 751.93,285.4 C768.66,260.76 770.26,241.87 751.93,218.4 C738.73,201.49 701.2757,190.0566 657.5257,181.4366" fill="none" id="Invited-to-Unknown" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="652.62,180.47,660.677,186.1344,657.5257,181.4366,662.2235,178.2853,652.62,180.47" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="115.4766" x="873.0019" y="231.4669">members remove</text><path d="M770.08,246.5328 L770.08,274.5328 A6,6 0 0 0 776.08,280.5328 L1085.08,280.5328 A6,6 0 0 0 1091.08,274.5328 L1091.08,250.5328 L1081.08,240.5328 L776.08,240.5328 A6,6 0 0 0 770.08,246.5328" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M1081.08,240.5328 L1081.08,247.5328 A3,3 0 0 0 1084.08,250.5328 L1091.08,250.5328 L1081.08,240.5328" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="300.3203" x="776.08" y="257.5997">The same endpoint withdraws an unanswered</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="277.437" x="776.08" y="272.7325">invitation and removes an active member.</text></g><!--link Invited to Member--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="18" id="lnk10"><path d="M551.54,361.84 C528.66,370.5 503.3,381.78 481.93,395.4 C453.75,413.36 429.8084,436.5725 411.7484,456.0625" fill="none" id="Invited-to-Member" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="408.35,459.73,417.4012,455.8472,411.7484,456.0625,411.5332,450.4097,408.35,459.73" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="124.541" x="482.93" y="408.4669">the person accepts</text></g><!--link Invited to Failed--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="19" id="lnk11"><path d="M659.48,365.79 C706.42,392.08 776.338,431.2361 823.208,457.4961" fill="none" id="Invited-to-Failed" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="827.57,459.94,821.6735,452.0513,823.208,457.4961,817.7632,459.0306,827.57,459.94" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="158.501" x="736.79" y="408.4669">GitHub records a reason</text></g><!--link Member to Owner--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="26" id="lnk13"><path d="M363.14,459.75 C329.95,424.26 270.12,355.08 236.93,285.4 C199.83,207.47 184.0981,109.9404 178.2681,63.9004" fill="none" id="Member-to-Owner" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="177.64,58.94,174.8023,68.3712,178.2681,63.9004,182.7389,67.3662,177.64,58.94" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="150.2998" x="237.93" y="256.4669">role changed in GitHub</text></g><!--link Owner to Member--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="27" id="lnk14"><path d="M146.7,59.06 C97.62,104.46 6,204.72 51.93,285.4 C116.52,398.83 269.3114,452.9055 342.9714,473.3055" fill="none" id="Owner-to-Member" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="347.79,474.64,340.1841,468.383,342.9714,473.3055,338.0489,476.0928,347.79,474.64" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="150.2998" x="52.93" y="256.4669">role changed in GitHub</text></g><!--link Member to Outside--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="29" id="lnk15"><path d="M417.24,510.65 C425.36,516.69 434.28,522.9 442.93,528.06 C530.53,580.29 634.5767,625.5204 701.6767,652.7404" fill="none" id="Member-to-Outside" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="706.31,654.62,699.4737,647.5302,701.6767,652.7404,696.4665,654.9434,706.31,654.62" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="115.2988" x="738.6675" y="571.1269">members convert</text><path d="M638.51,586.1928 L638.51,614.1928 A6,6 0 0 0 644.51,620.1928 L947.51,620.1928 A6,6 0 0 0 953.51,614.1928 L953.51,590.1928 L943.51,580.1928 L644.51,580.1928 A6,6 0 0 0 638.51,586.1928" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M943.51,580.1928 L943.51,587.1928 A3,3 0 0 0 946.51,590.1928 L953.51,590.1928 L943.51,580.1928" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="263.4531" x="644.51" y="597.2597">Keeps only the repositories their current</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.6138" x="644.51" y="612.3925">teams allow. Guarded exactly like a removal.</text></g><!--link Outside to Unknown--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" data-link-type="dependency" data-source-line="35" id="lnk16"><path d="M850.64,673.51 C889.86,667 935.12,653.35 966.93,625.06 C1311.14,318.99 1202.35,326.62 1103.93,218.4 C1074.19,185.69 814.7774,172.5013 657.4074,167.4213" fill="none" id="Outside-to-Unknown" style="stroke