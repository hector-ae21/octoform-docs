AFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="70.94" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="282.769" x="140.9864" y="104.3638">asks what Octoform believes each selected</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="288.4185" x="70.94" y="119.4966">account supports, before planning against it</text></g><!--link RequestingEvidence to Resolving--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M59.94,200.5669 C59.94,224.8469 59.94,256.9869 59.94,281.2069" fill="none" id="RequestingEvidence-to-Resolving" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="59.94,286.2069,63.94,277.2069,59.94,281.2069,55.94,277.2069,59.94,286.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M64.94,229.2969 L64.94,257.2969 A6,6 0 0 0 70.94,263.2969 L407.94,263.2969 A6,6 0 0 0 413.94,257.2969 L413.94,233.2969 L403.94,223.2969 L70.94,223.2969 A6,6 0 0 0 64.94,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M403.94,223.2969 L403.94,230.2969 A3,3 0 0 0 406.94,233.2969 L413.94,233.2969 L403.94,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="70.94" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="255.7217" x="143.5191" y="240.3638">asks GitHub, because that is where the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="311.7397" x="70.94" y="255.4966">evidence is, and resolves each account by login</text></g><!--link Resolving to Presenting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk8"><path d="M59.94,336.4769 C59.94,373.6469 59.94,439.4569 59.94,476.8169" fill="none" id="Resolving-to-Presenting" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="59.94,481.8169,63.94,472.8169,59.94,476.8169,55.94,472.8169,59.94,481.8169" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M64.94,365.2969 L64.94,453.2969 A6,6 0 0 0 70.94,459.2969 L418.94,459.2969 A6,6 0 0 0 424.94,453.2969 L424.94,369.2969 L414.94,359.2969 L70.94,359.2969 A6,6 0 0 0 64.94,365.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M414.94,359.2969 L414.94,366.2969 A3,3 0 0 0 417.94,369.2969 L424.94,369.2969 L414.94,359.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="70.94" y="376.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="267.3315" x="143.5191" y="376.3638">reports evidence rather than assumption</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.5469" x="70.94" y="391.4966">&#8226; the account kind, resolved from the API</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="299.4126" x="70.94" y="406.6294">&#8226; the numeric identity, stable across renames</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="329.894" x="70.94" y="421.7622">&#8226; whether organisation-wide rulesets are available</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="333.6201" x="70.94" y="436.895">&#8226; every declaration that does not apply to this kind</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="251.5449" x="79.2046" y="452.0278">of account, with the reason it does not</text></g><!--link Presenting to *end*inspectCapabilities--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="31" id="lnk10"><path d="M59.94,532.5769 C59.94,558.7469 59.94,594.1469 59.94,612.9769" fill="none" id="Presenting-to-*end*inspectCapabilities" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="59.94,617.9769,63.94,608.9769,59.94,612.9769,55.94,608.9769,59.94,617.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M64.94,561.2969 L64.94,589.2969 A6,6 0 0 0 70.94,595.2969 L407.94,595.2969 A6,6 0 0 0 413.94,589.2969 L413.94,565.2969 L403.94,555.2969 L70.94,555.2969 A6,6 0 0 0 64.94,561.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M403.94,555.2969 L403.94,562.2969 A3,3 0 0 0 406.94,565.2969 L413.94,565.2969 L403.94,555.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="70.94" y="572.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="258.0703" x="140.9864" y="572.3638">corrects the declaration or accepts that</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="202.2046" x="70.94" y="587.4966">it will be reported on every run</text></g></g><g class="entity" data-qualified-name="CAPABILITIES_ESTABLISHED" data-source-line="38" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="216.8818" x="7" y="748.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="223.8818" y1="774.5969" y2="774.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="196.8818" x="17" y="766.2951">CAPABILITIES_ESTABLISHED</text></g><g cl