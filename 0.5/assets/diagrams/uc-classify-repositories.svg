FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="290.7861" x="125.0464" y="104.3638">asks which type each unclassified repository</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="80.6978" x="55" y="119.4966">should carry</text></g><!--link RequestingProposal to Evaluating--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.5669 C44,224.8469 44,256.9869 44,281.2069" fill="none" id="RequestingProposal-to-Evaluating" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,286.2069,48,277.2069,44,281.2069,40,277.2069,44,286.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,257.2969 A6,6 0 0 0 55,263.2969 L410,263.2969 A6,6 0 0 0 416,257.2969 L416,233.2969 L406,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M406,223.2969 L406,230.2969 A3,3 0 0 0 409,233.2969 L416,233.2969 L406,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="273.8315" x="127.5791" y="240.3638">evaluates the declared classification rules</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3271" x="55" y="255.4966">in order, and stops at the first that matches</text></g><!--link Evaluating to Proposing--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk8"><path d="M44,336.5669 C44,360.8469 44,392.9869 44,417.2069" fill="none" id="Evaluating-to-Proposing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,422.2069,48,413.2069,44,417.2069,40,413.2069,44,422.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,365.2969 L49,393.2969 A6,6 0 0 0 55,399.2969 L408,399.2969 A6,6 0 0 0 414,393.2969 L414,369.2969 L404,359.2969 L55,359.2969 A6,6 0 0 0 49,365.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M404,359.2969 L404,366.2969 A3,3 0 0 0 407,369.2969 L414,369.2969 L404,359.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="376.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.2573" x="127.5791" y="376.3638">presents the proposal and writes nothing,</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.9956" x="55" y="391.4966">because proposing is the default</text></g><!--link Proposing to *end*classifyRepositories--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="27" id="lnk10"><path d="M44,472.5769 C44,498.7469 44,534.1469 44,552.9769" fill="none" id="Proposing-to-*end*classifyRepositories" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,557.9769,48,548.9769,44,552.9769,40,548.9769,44,557.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,501.2969 L49,529.2969 A6,6 0 0 0 55,535.2969 L409,535.2969 A6,6 0 0 0 415,529.2969 L415,505.2969 L405,495.2969 L55,495.2969 A6,6 0 0 0 49,501.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M405,495.2969 L405,502.2969 A3,3 0 0 0 408,505.2969 L415,505.2969 L405,495.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="512.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.1646" x="125.0464" y="512.3638">either accepts the proposal as a report, or</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="178.3438" x="55" y="527.4966">asks for --apply to persist it</text></g></g><g class="entity" data-qualified-name="TYPES_PROPOSED" data-source-line="34" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="147.4424" x="156.78" y="718.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="156.78" x2="304.2224" y1="744.5969" y2="744.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="127.4424" x="166.78" y="736.2951">TYPES_PROPOSED</text></g><!--link classifyRepositories to TYPES_PROPOSED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="34" id="lnk12"><path d="M36.18,593.75 C33.35,626.86 40.2,659.13 61.5,688.3 C83.3,718.15 116.867,731.0059 151.617,737.1759" fill="none" id="classifyRepositories-to-TYPES_PROPOSED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="156.54,738.05,148.3779,732.5382,151.617,737.1759,146.9793,740.415,156.54,738.05" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M66.5,649.3 L66.5,662.3 A6,6 0 0 0 72.5,668.3 L342.5,668.3 A6,6 0 0 0 348.5,662.3 L348.5,653.3 L338.5,643.3 L72.5,643.3 A6,6 0 0 0 66.5,649.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M338.5,643.3 L338.5,650.3 A3,3 0 0 0 341.5,653.3 L348.5,653.3 L338.5,643.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="261.0537" x="72.5" y="660.3669">proposals reported; nothing was written</text></g><!--link classifyRepositories to TYPES_PROPOSED--><g class=