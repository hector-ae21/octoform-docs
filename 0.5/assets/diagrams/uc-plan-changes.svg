<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="993px" preserveAspectRatio="none" style="width:686px;height:993px;" version="1.1" viewBox="0 0 686 993" width="686px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="planChanges" data-source-line="3" id="ent0001"><path d="M13,7 L443,7 A6,6 0 0 1 449,13 L449,33.2969 L7,33.2969 L7,13 A6,6 0 0 1 13,7" fill="#10284A"/><path d="M7,33.2969 L449,33.2969 L449,813.2969 A6,6 0 0 1 443,819.2969 L13,819.2969 A6,6 0 0 1 7,813.2969 L7,33.2969" fill="#10284A"/><rect fill="none" height="812.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="442" x="7" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="449" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="102.0469" x="176.9766" y="24.9951">planChanges()</text><g class="entity" data-qualified-name="planChanges.RequestingPlan" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="planChanges.Observing" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="286.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="312.5938" y2="312.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="304.292">&#160;</text></g><g class="entity" data-qualified-name="planChanges.Classifying" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="467.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="493.5938" y2="493.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="485.292">&#160;</text></g><g class="entity" data-qualified-name="planChanges.Presenting" data-source-line="8" id="ent0005"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="648.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="674.5938" y2="674.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="666.292">&#160;</text></g><g class="start_entity" data-qualified-name="planChanges..start.planChanges" data-source-line="10" id="ent0006"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="planChanges..end.planChanges" data-source-line="40" id="ent0011"><ellipse cx="44" cy="795.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="795.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*planChanges to RequestingPlan--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" data-link-type="dependency" data-source-line="10" id="lnk7"><path d="M44,64.6369 C44,82.8269 44,118.5369 44,144.9069" fill="none" id="*start*planChanges-to-RequestingPlan" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,149.9069,48,140.9069,44,144.9069,40,140.9069,44,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,121.2969 A6,6 0 0 0 55,127.2969 L391,127.2969 A6,6 0 0 0 397,121.2969 L397,97.2969 L387,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M387,87.2969 L387,94.2969 A3,3 0 0 0 390,97.2969 L397,97.2969 L387,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.5371" x="125.0464" y="104.3638">asks what would change, for an explicit</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.7017" x="55" y="119.4966">policy and a deliberately narrow selection</text></g><!--link RequestingPlan to Observing--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M44,200.5669 C44,224.8469 44,256.9869 44,281.2069" fill="none" id="RequestingPlan-to-Observing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,286.2069,48,277.2069,44,281.2069,40,277.2069,44,286.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,257.2969 A6,6 0 0 0 55,263.2969 L419,263.2969 A6,6 0 0 0 425,257.2969 L425,233.2969 L415,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M415,223.2969 L415,230.2969 A3,3 0 0 0 418,233.2969 L425,233.2969 L415,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="282.9785" x="127.5791" y="240.3638">resolves policy, discovers the selection and</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="254.522" x="55" y="255.4966">reads only the state the policy is about</text></g><!--link Observing to Classifying--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="22" id="lnk9"><path d="M44,336.4369 C44,370.5969 44,427.6969 44,461.9669" fill="none" id="Observing-to-Classifying" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,466.9669,48,457.9669,44,461.9669,40,457.9669,44,466.9669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,365.2969 L49,438.2969 A6,6 0 0 0 55,444.2969 L396,444.2969 A6,6 0 0 0 402,438.2969 L402,369.2969 L392,359.2969 L55,359.2969 A6,6 0 0 0 49,365.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M392,359.2969 L392,366.2969 A3,3 0 0 0 395,369.2969 L402,369.2969 L392,359.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="376.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="260.4063" x="127.5791" y="376.3638">sorts every candidate into one category</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.2773" x="55" y="391.4966">&#8226; change: observed and desired values differ</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.1641" x="55" y="406.6294">&#8226; no change: they already agree</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.0625" x="55" y="421.7622">&#8226; warning: available, with a known consequence</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="315.0151" x="55" y="436.895">&#8226; blocked: availability or state cannot be proven</text></g><!--link Classifying to Presenting--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="31" id="lnk10"><path d="M44,517.4369 C44,551.5969 44,608.6969 44,642.9669" fill="none" id="Classifying-to-Presenting" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,647.9669,48,638.9669,44,642.9669,40,638.9669,44,647.9669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,546.2969 L49,619.2969 A6,6 0 0 0 55,625.2969 L391,625.2969 A6,6 0 0 0 397,619.2969 L397,550.2969 L387,540.2969 L55,540.2969 A6,6 0 0 0 49,546.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M387,540.2969 L387,547.2969 A3,3 0 0 0 390,550.2969 L397,550.2969 L387,540.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="557.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="255.2456" x="127.5791" y="557.3638">presents the plan and changes nothing</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="306.6553" x="55" y="572.4966">&#8226; blocked work stays in the report and is never</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="140.7656" x="63.2646" y="587.6294">handed to the applier</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.0869" x="55" y="602.7622">&#8226; accounts run one at a time, so reports do not</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="65.5586" x="63.2646" y="617.895">interleave</text></g><!--link Presenting to *end*planChanges--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" data-source-line="40" id="lnk12"><path d="M44,698.5769 C44,724.7469 44,760.1469 44,778.9769" fill="none" id="Presenting-to-*end*planChanges" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,783.9769,48,774.9769,44,778.9769,40,774.9769,44,783.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,727.2969 L49,755.2969 A6,6 0 0 0 55,761.2969 L391,761.2969 A6,6 0 0 0 397,755.2969 L397,731.2969 L387,721.2969 L55,721.2969 A6,6 0 0 0 49,727.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M387,721.2969 L387,728.2969 A3,3 0 0 0 390,731.2969 L397,731.2969 L387,721.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="738.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.1499" x="125.0464" y="738.3638">confirms scope, current values, desired</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="319.3633" x="55" y="753.4966">values, warnings and blocked work before acting</text></g></g><g class="entity" data-qualified-name="PLAN_PRESENTED" data-source-line="47" id="ent0013"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="146.6904" x="154.65" y="929.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="154.65" x2="301.3404" y1="955.5969" y2="955.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="126.6904" x="164.65" y="947.2951">PLAN_PRESENTED</text></g><!--link planChanges to PLAN_PRESENTED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="47" id="lnk14"><path d="M30.77,819.74 C34.9,847.68 45.05,874.54 63,899.3 C83.96,928.22 115.9583,940.9947 149.5683,947.3947" fill="none" id="planChanges-to-PLAN_PRESENTED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="154.48,948.33,146.3871,942.7171,149.568