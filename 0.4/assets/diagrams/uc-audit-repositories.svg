ngthAdjust="spacing" textLength="260.2603" x="125.0464" y="104.3638">asks which selected repositories fail the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="129.9683" x="55" y="119.4966">declared audit rules</text></g><!--link RequestingAudit to Observing--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.5669 C44,224.8469 44,256.9869 44,281.2069" fill="none" id="RequestingAudit-to-Observing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,286.2069,48,277.2069,44,281.2069,40,277.2069,44,286.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,257.2969 A6,6 0 0 0 55,263.2969 L432,263.2969 A6,6 0 0 0 438,257.2969 L438,233.2969 L428,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M428,223.2969 L428,230.2969 A3,3 0 0 0 431,233.2969 L438,233.2969 L428,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="295.9214" x="127.5791" y="240.3638">discovers the selected repositories and reads</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.1553" x="55" y="255.4966">their metadata, without declaring any desired value</text></g><!--link Observing to Reporting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk8"><path d="M44,336.4969 C44,367.5069 44,415.9469 44,446.9969" fill="none" id="Observing-to-Reporting" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,451.9969,48,442.9969,44,446.9969,40,442.9969,44,451.9969" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,365.2969 L49,423.2969 A6,6 0 0 0 55,429.2969 L415,429.2969 A6,6 0 0 0 421,423.2969 L421,369.2969 L411,359.2969 L55,359.2969 A6,6 0 0 0 49,365.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M411,359.2969 L411,366.2969 A3,3 0 0 0 414,369.2969 L421,369.2969 L411,359.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="376.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="278.8208" x="127.5791" y="376.3638">reports each finding against the repository</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="311.5366" x="55" y="391.4966">that produced it, and nothing is ever attempted</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.0098" x="55" y="406.6294">&#8226; repository names arrive from GitHub, so control</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="249.5327" x="63.2646" y="421.7622">characters are escaped before display</text></g><!--link Reporting to *end*auditRepositories--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="29" id="lnk10"><path d="M44,502.5769 C44,528.7469 44,564.1469 44,582.9769" fill="none" id="Reporting-to-*end*auditRepositories" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,587.9769,48,578.9769,44,582.9769,40,578.9769,44,587.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,531.2969 L49,559.2969 A6,6 0 0 0 55,565.2969 L394,565.2969 A6,6 0 0 0 400,559.2969 L400,535.2969 L390,525.2969 L55,525.2969 A6,6 0 0 0 49,531.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M390,525.2969 L390,532.2969 A3,3 0 0 0 393,535.2969 L400,535.2969 L390,525.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="542.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="259.9556" x="125.0464" y="542.3638">reads the findings as evidence, not as a</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="292.5444" x="55" y="557.4966">plan: no desired state was declared for them</text></g></g><g class="entity" data-qualified-name="FINDINGS_REPORTED" data-source-line="36" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="170.7119" x="149.14" y="718.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="149.14" x2="319.8519" y1="744.5969" y2="744.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="150.7119" x="159.14" y="736.2951">FINDINGS_REPORTED</text></g><!--link auditRepositories to FINDINGS_REPORTED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="36" id="lnk12"><path d="M76.07,623.37 C78.43,646.03 85.73,667.95 99.5,688.3 C111.25,705.65 124.9471,715.5251 144.3371,723.5151" fill="none" id="auditRepositories-to-FINDINGS_REPORTED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="148.96,725.42,142.1627,718.2928,144.3371,723.5151,139.1148,725.6894,148.96,725.42" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M104.5,664.3 L104.5,677.3 A6,6 0 0 0 110.5,683.3 L312.5,683.3 A6,6 0 0 0 318.5,677.3 L318.5,668.3 L308.5,658.3 L110.5,658.3 A6,6 0 0 0 104.5,664.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M308.5,658.