fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.916" x="60.75" y="104.3638">Policy author</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="262.9009" x="161.7983" y="104.3638">asks whether a configuration file is valid</text></g><!--link RequestingCheck to Composing--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="14" id="lnk7"><path d="M49.75,185.4369 C49.75,219.5969 49.75,276.6969 49.75,310.9669" fill="none" id="RequestingCheck-to-Composing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="49.75,315.9669,53.75,306.9669,49.75,310.9669,45.75,306.9669,49.75,315.9669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M54.75,214.2969 L54.75,287.2969 A6,6 0 0 0 60.75,293.2969 L447.75,293.2969 A6,6 0 0 0 453.75,287.2969 L453.75,218.2969 L443.75,208.2969 L60.75,208.2969 A6,6 0 0 0 54.75,214.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M443.75,208.2969 L443.75,215.2969 A3,3 0 0 0 446.75,218.2969 L453.75,218.2969 L443.75,208.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="60.75" y="225.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.7222" x="133.3291" y="225.3638">loads the document exactly as a GitHub-facing</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="295.458" x="60.75" y="240.4966">command would, and needs no token to do it</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="295.3311" x="60.75" y="255.6294">&#8226; follows imports relative to the declaring file</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="161.2939" x="60.75" y="270.7622">&#8226; folds in named policies</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="242.6392" x="60.75" y="285.895">&#8226; applies precedence between layers</text></g><!--link Composing to Reporting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="23" id="lnk8"><path d="M49.75,366.6769 C49.75,406.9569 49.75,481.8969 49.75,522.0669" fill="none" id="Composing-to-Reporting" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="49.75,527.0669,53.75,518.0669,49.75,522.0669,45.75,518.0669,49.75,527.0669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M54.75,395.2969 L54.75,498.2969 A6,6 0 0 0 60.75,504.2969 L433.75,504.2969 A6,6 0 0 0 439.75,498.2969 L439.75,399.2969 L429.75,389.2969 L60.75,389.2969 A6,6 0 0 0 54.75,395.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M429.75,389.2969 L429.75,396.2969 A3,3 0 0 0 432.75,399.2969 L439.75,399.2969 L429.75,389.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="60.75" y="406.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.8843" x="133.3291" y="406.3638">checks every rule that does not need GitHub</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="319.4395" x="60.75" y="421.4966">&#8226; unknown key, naming the closest declared one</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.7563" x="60.75" y="436.6294">&#8226; value of the wrong kind</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.9351" x="60.75" y="451.7622">&#8226; import or policy cycle, with the chain</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308.2739" x="60.75" y="466.895">&#8226; reference to a policy that was never declared</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="261.3203" x="60.75" y="482.0278">&#8226; value shaped like an issued credential</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.4438" x="60.75" y="497.1606">&#8226; owner that is not a GitHub account login</text></g><!--link Reporting to *end*validateConfiguration--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="34" id="lnk10"><path d="M49.75,577.5769 C49.75,603.7469 49.75,639.1469 49.75,657.9769" fill="none" id="Reporting-to-*end*validateConfiguration" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="49.75,662.9769,53.75,653.9769,49.75,657.9769,45.75,653.9769,49.75,662.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M54.75,606.2969 L54.75,634.2969 A6,6 0 0 0 60.75,640.2969 L419.75,640.2969 A6,6 0 0 0 425.75,634.2969 L425.75,610.2969 L415.75,600.2969 L60.75,600.2969 A6,6 0 0 0 54.75,606.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M415.75,600.2969 L415.75,607.2969 A3,3 0 0 0 418.75,610.2969 L425.75,610.2969 L415.75,600.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.916" x="60.75" y="617.3638">Policy author</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="249.1963" x="161.7983" y="617.3638">reads the resolved owners, or the first</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.9458" x="60.75" y="632.4966">error with its file and YAML path</text></g></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="41" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="7" y="793.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="227.5049" y1="819.5969" y2="819.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="17" y="811.2951">CONFIGURATION_RESOLVED</text></g><g class="entity" data-qualified-name="NO_CONFIGURATION" data-source-line="46" id="ent0013"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="166.5146" x="291" y="793.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="291" x2="457.5146" y1="819.5969" y2="819.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="146.5146" x="301" y="811.2951">NO_CONFIGURATION</text></g><!--link validateConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="41" id="lnk12"><path d="M119.88,698.79 C117.8,708.68 115.91,718.53 114.25,728.3 C110.58,749.94 111.3721,769.9879 113.2821,787.9779" fill="none" id="validateConfiguration-to-CONFIGURATION_RESOLVED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="113.81,792.95,116.8375,783.578,113.2821,787.9779,108.8822,784.4226,113.81,792.95" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M119.25,739.3 L119.25,752.3 A6,6 0 0 0 125.25,758.3 L320.25,758.3 A6,6 0 0 0 326.25,752.3 L326.25,743.3 L316.25,733.3 L125.25,733.3 A6,6 0 0 0 119.25,739.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M316.25,733.3 L316.25,740.3 A3,3 0 0 0 319.25,743.3 L326.25,743.3 L316.25,733.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.1577" x="125.25" y="750.3669">the document is valid; exit 0</text></g><!--link validateConfiguration to NO_CONFIGURATION--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="46" id="lnk14"><path d="M341.2,698.5 C352.21,738.07 360.2596,767.003 366.1896,788.313" fill="none" id="validateConfiguration-to-NO_CONFIGURATION" style="stroke:#A78BFA;stroke-width:2;"/><polygon fill="#A78BFA" points="367.53,793.13,368.9708,783.3871,366.1896,788.313,361.2636,785.5318,367.53,793.13" style="stroke:#A78BFA;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M363.27,739.3 L363.27,752.3 A6,6 0 0 0 369.27,758.3 L606.27,758.3 A6,6 0 0 0 612.27,752.3 L612.27,743.3 L602.27,733.3 L369.27,733.3 A6,6 0 0 0 363.27,739.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M602.27,733.3 L602.27,740.3 A3,3 0 0 0 605.27,743.3 L612.27,743.3 L602.27,733.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="228.8203" x="369.27" y="750.3669">the document does not load; exit 2</text></g><?plantuml-src ZLJRRjD047ttLmpb1L0AY1UGg2g5qfPA9K7X8g6gYZRhSRpoUiVi9SP2I7mBdyQNCBjsqYOD5qMAOk_EkSrCxYaZTSWHvhx46X-hKEiiSrvuX9NGAkSV9sGAjGnMU4K6X8E3lISF7Xx0jom3wAiF-CDtP_WbeFFAB4zAbDNkyGdL3Ja-lLlNa8rb4V7gqJKS7Xxl0JF49QnAAnCVZnR7xqWhsO48lYHxz6Hnp6YLWxP4TcX1WDooKoYDe5nlbX7Gv0aqqkxG9Gct1TybdqfF1TawyMeIkGDcXPnagD5umAz2Ujr5WmBEbNyJ5eU5a3sSfBeMJDzIqFa8ua-3o126m5E5XhyP2fJdoxz-_8I2jARMWQfZLWuiQZQrmdWlqQBKmZ9uSdbJn93AW14rvj34k1IwuLGqZUOdQ2nApD58X0Nw5fbSYmwjsube4yVGdtNJ_XcEZ8awm1NQ3cpW9lXIUBQ7qQzFpeU41cd1L8PQ0nLseoW-aaQNKfFZBWrkkOhCsYitDR288jrhBN55fKm-dFQn0Ta-X0va9pMEe5M-x95BeSnmsMA1DkN1uOfrHTBSSZTDDBAHi4NlIj6mAgqgv9xohBd0ZzB6UBqIUhZCrXWX0Qe-WlM4W92I0a-FfcNIipsZG-If0Rme_xaK5jV3QT6HNiNSeW8tYe74zuMoBauQMijlKYYAXomjJ9pDp-Etbz08NzvMz3tBzlzjfDsPJiukpZ_EnXykffFvxFJzzFBJwUjiI-xMkgptyYKlZlBmDBjn_WUMg_lZvozUdOslc