0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="497.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="523.5938" y2="523.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="515.292">&#160;</text></g><g class="start_entity" data-qualified-name="applySavedPlan..start.applySavedPlan" data-source-line="9" id="ent0005"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="applySavedPlan..end.applySavedPlan" data-source-line="32" id="ent0009"><ellipse cx="44" cy="644.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="644.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*applySavedPlan to PresentingArtifact--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M44,64.6369 C44,82.8269 44,118.5369 44,144.9069" fill="none" id="*start*applySavedPlan-to-PresentingArtifact" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,149.9069,48,140.9069,44,144.9069,40,140.9069,44,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,121.2969 A6,6 0 0 0 55,127.2969 L435,127.2969 A6,6 0 0 0 441,121.2969 L441,97.2969 L431,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M431,87.2969 L431,94.2969 A3,3 0 0 0 434,97.2969 L441,97.2969 L431,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="123.6841" x="55" y="104.3638">Change reviewer</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="243.4771" x="182.8164" y="104.3638">hands over a saved plan and asks for</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="211.7832" x="55" y="119.4966">exactly the operations it records</text></g><!--link PresentingArtifact to Verifying--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.6769 C44,240.9569 44,315.8969 44,356.0669" fill="none" id="PresentingArtifact-to-Verifying" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,361.0669,48,352.0669,44,356.0669,40,352.0669,44,361.0669" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,332.2969 A6,6 0 0 0 55,338.2969 L434,338.2969 A6,6 0 0 0 440,332.2969 L440,233.2969 L430,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M430,223.2969 L430,230.2969 A3,3 0 0 0 433,233.2969 L440,233.2969 L430,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="298.0605" x="127.5791" y="240.3638">re-checks six things before touching anything</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7407" x="55" y="255.4966">&#8226; the artifact schema version</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.8604" x="55" y="270.6294">&#8226; the expiry</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.8579" x="55" y="285.7622">&#8226; the authenticated actor</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="220.5303" x="55" y="300.895">&#8226; each account's numeric identity</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="296.6577" x="55" y="316.0278">&#8226; the digest of every configuration source file</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.5024" x="55" y="331.1606">&#8226; the digest of the resolved configuration</text></g><!--link Verifying to Executing--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk8"><path d="M44,411.5669 C44,435.8469 44,467.9869 44,492.2069" fill="none" id="Verifying-to-Executing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,497.2069,48,488.2069,44,492.2069,40,488.2069,44,497.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,440.2969 L49,468.2969 A6,6 0 0 0 55,474.2969 L425,474.2969 A6,6 0 0 0 431,468.2969 L431,444.2969 L421,434.2969 L55,434.2969 A6,6 0 0 0 49,440.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M421,434.2969 L421,441.2969 A3,3 0 0 0 424,444.2969 L431,444.2969 L421,434.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="451.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="288.6787" x="127.5791" y="451.3638">performs exactly the recorded operations; it</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.9341" x="55" y="466.4966">does not re-plan and does not re-observe</text></g><!--link Executing to *end*applySavedPlan--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="32" id="lnk10"><path d="M44,547.5769 C44,573.7469 44,609.146