non-interactive use.Reachable only with --yes.Apply" data-source-line="15" id="ent0010"><ellipse cx="439.6279" cy="374.5336" fill="#10284A" rx="59.0279" ry="14.5236" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="79.2354" x="400.0102" y="379.1821">applyPlan()</text></g><!--entity ApplySaved--><g class="entity" data-qualified-name="Octoform 0.4 . non-interactive use.Reachable only with --yes.ApplySaved" data-source-line="16" id="ent0011"><ellipse cx="439.6271" cy="307.5314" fill="#10284A" rx="76.5571" ry="17.7114" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="122.4863" x="378.384" y="312.1799">applySavedPlan()</text></g><!--entity Automation--><g class="entity" data-qualified-name="Automation" data-source-line="4" id="ent0001"><ellipse cx="85.5711" cy="447.89" fill="#10284A" rx="8" ry="8" style="stroke:#38BDF8;stroke-width:0.5;"/><path d="M85.5711,455.89 L85.5711,482.89 M72.5711,463.89 L98.5711,463.89 M85.5711,482.89 L72.5711,497.89 M85.5711,482.89 L98.5711,497.89" fill="none" style="stroke:#38BDF8;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="148.7021" x="11.22" y="512.3851">Automation workflow</text></g><!--entity Application--><g class="entity" data-qualified-name="Application" data-source-line="5" id="ent0002"><ellipse cx="85.5703" cy="183.89" fill="#10284A" rx="8" ry="8" style="stroke:#38BDF8;stroke-width:0.5;"/><path d="M85.5703,191.89 L85.5703,218.89 M72.5703,199.89 L98.5703,199.89 M85.5703,218.89 L72.5703,233.89 M85.5703,218.89 L98.5703,233.89" fill="none" style="stroke:#38BDF8;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="159.1406" x="6" y="248.3851">Integrating application</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="33" id="ent0023"><path d="M226.14,12 L226.14,131.0625 A6,6 0 0 0 232.14,137.0625 L435.63,137.0625 L439.63,188.3 L443.63,137.0625 L647.1107,137.0625 A6,6 0 0 0 653.1107,131.0625 L653.1107,16 L643.1107,6 L232.14,6 A6,6 0 0 0 226.14,12" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M643.1107,6 L643.1107,13 A3,3 0 0 0 646.1107,16 L653.1107,16 L643.1107,6" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="403.8696" x="232.14" y="23.0669">An automation workflow is the same actor role as an operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.9707" x="232.14" y="38.1997">minus the ability to answer a prompt. It reaches the same use</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="389.2065" x="232.14" y="53.3325">cases; --yes replaces the confirmation step, so the review it</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.7085" x="232.14" y="68.4653">represents has to exist outside Octoform.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="232.14" y="83.5981">&#160;</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="381.6782" x="232.14" y="98.731">An integrating application calls exported functions directly</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="365.9932" x="232.14" y="113.8638">and therefore owns authentication, invocation and error</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.8018" x="232.14" y="128.9966">handling around them.</text></g><!--link Automation to Validate--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="dependency" data-source-line="21" id="lnk13"><path d="M105.5,515.93 C123.61,547.86 154.21,591.11 195.14,610.53 C417.17,715.9 520.23,702.58 748.11,610.53 C814.6,583.68 865.8939,518.2147 890.0939,482.8947" fill="none" id="Automation-to-Validate" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="892.92,478.77,884.5333,483.9336,890.0939,482.8947,891.1328,488.4553,892.92,478.77" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Automation to Audit--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" data-link-type="dependency" data-source-line="22" id="lnk14"><path d="M141.34,516.1 C157.87,525.68 176.57,534.61 195.14,539.53 C432.68,602.58 553.38,689.46 748.11,539.53 C792.19,505.6 741.15,458.24 780.11,418.53 C794.19,404.19 808.7073,396.7798 828.0373,391.4898" fill="none" id="Automation-to-Audit" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="832.86,390.17,823.1234,388.6875,828.0373,391.4898,825.235,396.4038,832.86,390.17" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Automation to Plan--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" data-link-type="dependency" data-source-line="23" id="lnk15"><path d="M160.22,502.47 C293.23,542.44 575.67,603.46 748.11,468.53 C792.26,433.99 740.59,386.29 780.11,346.53 C796.3,330.24 814.5155,322.5415 836.5555,317.9415" fill="none" id="Automation-to-Plan" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="841.45,316.92,831.8226,314.8432,836.5555,317.9415,833.4571,322.6744,841.45,316.92" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Automation to Save--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" data-link-type="dependency" data-source-line="24" id="lnk16"><path d="M160.23,477.57 C270.41,475.55 483.31,463.61 653.11,405.53 C699.49,389.67 715.4,386.03 748.11,349.53 C771.21,323.76 753.58,300.77 780.11,278.53 C800.51,261.44 823.8882,254.0