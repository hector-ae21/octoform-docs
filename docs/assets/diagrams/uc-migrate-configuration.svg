<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="963px" preserveAspectRatio="none" style="width:1149px;height:963px;" version="1.1" viewBox="0 0 1149 963" width="1149px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="migrateConfiguration" data-source-line="3" id="ent0001"><path d="M231.29,7 L687.29,7 A6,6 0 0 1 693.29,13 L693.29,33.2969 L225.29,33.2969 L225.29,13 A6,6 0 0 1 231.29,7" fill="#10284A"/><path d="M225.29,33.2969 L693.29,33.2969 L693.29,768.2969 A6,6 0 0 1 687.29,774.2969 L231.29,774.2969 A6,6 0 0 1 225.29,768.2969 L225.29,33.2969" fill="#10284A"/><rect fill="none" height="767.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="468" x="225.29" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="225.29" x2="693.29" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160.7197" x="378.9301" y="24.9951">migrateConfiguration()</text><g class="entity" data-qualified-name="migrateConfiguration.RequestingConversion" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="237.29" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="237.29" x2="287.29" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="260.0649" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="migrateConfiguration.CheckingImports" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="237.29" y="316.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="237.29" x2="287.29" y1="342.5938" y2="342.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="260.0649" y="334.292">&#160;</text></g><g class="entity" data-qualified-name="migrateConfiguration.Previewing" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="237.29" y="467.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="237.29" x2="287.29" y1="493.5938" y2="493.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="260.0649" y="485.292">&#160;</text></g><g class="entity" data-qualified-name="migrateConfiguration.Deciding" data-source-line="8" id="ent0005"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="237.29" y="603.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="237.29" x2="287.29" y1="629.5938" y2="629.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="260.0649" y="621.292">&#160;</text></g><g class="start_entity" data-qualified-name="migrateConfiguration..start.migrateConfiguration" data-source-line="10" id="ent0006"><ellipse cx="262.29" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="migrateConfiguration..end.migrateConfiguration" data-source-line="37" id="ent0011"><ellipse cx="262.29" cy="750.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="262.29" cy="750.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*migrateConfiguration to RequestingConversion--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" data-link-type="dependency" data-source-line="10" id="lnk7"><path d="M262.29,64.6369 C262.29,82.8269 262.29,118.5369 262.29,144.9069" fill="none" id="*start*migrateConfiguration-to-RequestingConversion" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="262.29,149.9069,266.29,140.9069,262.29,144.9069,258.29,140.9069,262.29,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M267.29,93.2969 L267.29,121.2969 A6,6 0 0 0 273.29,127.2969 L616.29,127.2969 A6,6 0 0 0 622.29,121.2969 L622.29,97.2969 L612.29,87.2969 L273.29,87.2969 A6,6 0 0 0 267.29,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M612.29,87.2969 L612.29,94.2969 A3,3 0 0 0 615.29,97.2969 L622.29,97.2969 L612.29,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.916" x="273.29" y="104.3638">Policy author</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.7778" x="374.3383" y="104.3638">asks to convert a file that names its</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.8369" x="273.29" y="119.4966">account in a root owner field</text></g><!--link RequestingConversion to CheckingImports--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M262.29,200.4969 C262.29,231.5069 262.29,279.9469 262.29,310.9969" fill="none" id="RequestingConversion-to-CheckingImports" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="262.29,315.9969,266.29,306.9969,262.29,310.9969,258.29,306.9969,262.29,315.9969" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M267.29,229.2969 L267.29,287.2969 A6,6 0 0 0 273.29,293.2969 L663.29,293.2969 A6,6 0 0 0 669.29,287.2969 L669.29,233.2969 L659.29,223.2969 L273.29,223.2969 A6,6 0 0 0 267.29,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M659.29,223.2969 L659.29,230.2969 A3,3 0 0 0 662.29,233.2969 L669.29,233.2969 L659.29,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="273.29" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="292.2461" x="345.8691" y="240.3638">resolves the document and reports what it is</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="368.0815" x="273.29" y="255.4966">&#8226; a file that already declares owners needs no migration</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="381.7671" x="273.29" y="270.6294">&#8226; the converted result is equivalent: the same repositories</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171.958" x="281.5546" y="285.7622">resolve to the same policy</text></g><!--link CheckingImports to Previewing--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="24" id="lnk9"><path d="M262.29,366.5669 C262.29,394.2769 262.29,434.3369 262.29,462.0369" fill="none" id="CheckingImports-to-Previewing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="262.29,467.0369,266.29,458.0369,262.29,462.0369,258.29,458.0369,262.29,467.0369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M267.29,395.2969 L267.29,438.2969 A6,6 0 0 0 273.29,444.2969 L661.29,444.2969 A6,6 0 0 0 667.29,438.2969 L667.29,399.2969 L657.29,389.2969 L273.29,389.2969 A6,6 0 0 0 267.29,395.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M657.29,389.2969 L657.29,396.2969 A3,3 0 0 0 660.29,399.2969 L667.29,399.2969 L657.29,389.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="273.29" y="406.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="306.9155" x="345.8691" y="406.3638">checks what the imports declare, because only</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.6069" x="273.29" y="421.4966">the named file is converted and a repos block left at an</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="239.04" x="273.29" y="436.6294">import's root would strand the result</text></g><!--link Previewing to Deciding--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="31" id="lnk10"><path d="M262.29,517.5669 C262.29,541.8469 262.29,573.9869 262.29,598.2069" fill="none" id="Previewing-to-Deciding" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="262.29,603.2069,266.29,594.2069,262.29,598.2069,258.29,594.2069,262.29,603.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M267.29,546.2969 L267.29,574.2969 A6,6 0 0 0 273.29,580.2969 L644.29,580.2969 A6,6 0 0 0 650.29,574.2969 L650.29,550.2969 L640.29,540.2969 L273.29,540.2969 A6,6 0 0 0 267.29,546.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M640.29,540.2969 L640.29,547.2969 A3,3 0 0 0 643.29,550.2969 L650.29,550.2969 L640.29,540.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="273.29" y="557.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.7007" x="345.8691" y="557.3638">prints the converted document and changes</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="277.894" x="273.29" y="572.4966">nothing, because previewing is the default</text></g><!--link Deciding to *end*migrateConfiguration--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" data-source-line="37" id="lnk12"><path d="M262.29,653.5769 C262.29,679.7469 262.29,715.1469 262.29,733.9769" fill="none" id="Deciding-to-*end*migrateConfiguration" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="262.29,738.9769,266.29,729.9769,262.29,733.9769,258.29,729.9769,262.29,738.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M267.29,682.2969 L267.29,710.2969 A6,6 0 0 0 273.29,716.2969 L621.29,716.2969 A6,6 0 0 0 627.29,710.2969 L627.29,686.2969 L617.29,676.2969 L273.29,676.2969 A6,6 0 0 0 267.29,682.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M617.29,676.2969 L617.29,683.2969 A3,3 0 0 0 620.29,686.2969 L627.29,686.2969 L617.29,676.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.916" x="273.29" y="693.3638">Policy author</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="238.8433" x="374.3383" y="693.3638">either keeps the preview, or asks for</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.3438" x="273.29" y="708.4966">--write to convert the file in place</text></g></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="44" id="ent0013"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="349.04" y="899.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="349.04" x2="569.5449" y1="925.5969" y2="925.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="359.04" y="917.2951">CONFIGURATION_RESOLVED</text></g><!--link migrateConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="44" id="lnk14"><path d="M225.11,544.37 C106.97,640.03 6,764.59 96.29,869.3 C128.49,906.64 249.4036,918.3803 343.9736,921.9703" fill="none" id="migrateConfiguration-to-CONFIGURATION_RESOLVED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="348.97,922.16,340.1282,917.8215,343.9736,921.9703,339.8247,925.8157,348.97,922.16" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M101.29,815.3 L101.29,858.3 A6,6 0 0 0 107.29,864.3 L405.29,864.3 A6,6 0 0 0 411.29,858.3 L411.29,819.3 L401.29,809.3 L107.29,809.3 A6,6 0 0 0 101.29,815.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M401.29,809.3 L401.29,816.3 A3,3 0 0 0 404.29,819.3 L411.29,819.3 L401.29,809.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.1865" x="107.29" y="826.3669">comments, ordering and formatting survive:</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="266.8301" x="107.29" y="841.4997">the conversion moves blocks rather than</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.0674" x="107.29" y="856.6325">re-serializing the document</text></g><!--link migrateConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="51" id="lnk15"><path d="M456.41,774.67 C456.37,784.65 456.33,794.54 456.29,804.3 C456.19,833.19 455.49,840.42 456.29,869.3 C456.56,878.97 456.8032,884.6088 457.3532,893.8588" fill="none" id="migrateConfiguration-to-CONFIGURATION_RESOLVED-1" style="stroke:#A78BFA;stroke-width:2;"/><polygon fill="#A78BFA" points="457.65,898.85,461.1088,889.6284,457.3532,893.8588,453.1229,890.1033,457.65,898.85" style="stroke:#A78BFA;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M461.29,815.3 L461.29,858.3 A6,6 0 0 0 467.29,864.3 L787.29,864.3 A6,6 0 0 0 793.29,858.3 L793.29,819.3 L783.29,809.3 L467.29,809.3 A6,6 0 0 0 461.29,815.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M783.29,809.3 L783.29,816.3 A3,3 0 0 0 786.29,819.3 L793.29,819.3 L783.29,809.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9858" x="467.29" y="826.3669">refused, naming the files to move: an import</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.3901" x="467.29" y="841.4997">declares repos at its root, so converting this</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="311.1431" x="467.29" y="856.6325">file alone would produce one that does not load</text></g><!--link migrateConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="58" id="lnk16"><path d="M693.54,555.15 C800.95,649.86 887.46,769.68 802.29,869.3 C772.67,903.95 663.3137,916.2581 574.6937,920.7281" fill="none" id="migrateConfiguration-to-CONFIGURATION_RESOLVED-2" style="stroke:#A78BFA;stroke-width:2;"/><polygon fill="#A78BFA" points="569.7,920.98,578.8901,924.5215,574.6937,920.7281,578.4871,916.5317,569.7,920.98" style="stroke:#A78BFA;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M838.96,815.3 L838.96,858.3 A6,6 0 0 0 844.96,864.3 L1128.96,864.3 A6,6 0 0 0 1134.96,858.3 L1134.96,819.3 L1124.96,809.3 L844.96,809.3 A6,6 0 0 0 838.96,815.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M1124.96,809.3 L1124.96,816.3 A3,3 0 0 0 1127.96,819.3 L1134.96,819.3 L1124.96,809.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="267.3633" x="844.96" y="826.3669">--write refused: the file has uncommitted</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="238.5132" x="844.96" y="841.4997">changes in a git working tree, so the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.8755" x="844.96" y="856.6325">conversion could not be reviewed as a diff</text></g><?plantuml-src hLJRRXCn47tVhnZA0nSby0YAgagb5rG9DQXSNgggSkpPh1MllTZUH0KXyIry6b_2ZBt99jkWzW4boYRnp9bppipuYRRIj0hXDbPOuolTrgOeGXGHeTPpJyyJPqizR-chTXP4W8Dz1yzV7C2FeW38kGVqej0h_DPYYDhEANY9Fb3aCEQaGhcWY8kwSJw6uV57ZqkDAmeOdfoYr8h_fuFhbpSm7X_zgw1rb4RiZROB-dauE_heZ9Pt8DfOEN_uUdP4Y8i0qO5CYH44bDeWn4f4iAB603gn4rAwraRGP0PuvoAubKLFqMWKdQDLgHxJsaSdyRml-Zx5gOokTBvEx3m6PvP4Wle4oicsHk8Wg9R7104h9ghfpMX_VltU4I2CHw7kGA4qWh0ovm0MKT6dwvgTtU9aBjCvWLmZj8QXWGJffJ1KV99Y0ZcJA0GTdTV8nM7DbktS13N9yO510n-IDpiTVy0MoVcTTgwaEvnEvmXcA4KR6C9mROxXPghi3GdgHRAP8ck1cN5o0GPBievjfjGC_IpadgzSQnJDe-SiHiqM3UJrKfAopSG-gAlnsiOmwC9EssKbx1oxoQa8jDVQz5LrDp1OYllirdGIDzgWHouAQeBqi41iCdfNRmJEvoqY6PGy7g-yZhYzKnoTZRVG625ncz7FejXxvQHzcLwUNxp_SdNy-M9wUNjrzcdwuUlPQR53LxgQtGdCGw5dOMmKUoeYxo24rY_r4YT5xslQoDhnPgMUKtj5aaThOmkFuq18mkZldB-zUqNlv7xMrq-FtxnzTtvyyqZw7ajgdXhnVAwBiLVfKcA64vBJJM6nsUCyhcdpysIE86pypZ1q8IJFXN4Mky5jl5EjvEBT1Q4SyZqGmJYX_hkszIXq6YVz85HqaRUMMwSZpNZHZNM-NUUQ5yqlaWwFcBHHQh7LEvdqCFCPu_CWyYwJ9w1qMMwa_0K0?></g></svg>