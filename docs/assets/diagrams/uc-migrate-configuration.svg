<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="812px" preserveAspectRatio="none" style="width:706px;height:812px;" version="1.1" viewBox="0 0 706 812" width="706px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="migrateConfiguration" data-source-line="3" id="ent0001"><path d="M13,7 L469,7 A6,6 0 0 1 475,13 L475,33.2969 L7,33.2969 L7,13 A6,6 0 0 1 13,7" fill="#10284A"/><path d="M7,33.2969 L475,33.2969 L475,617.2969 A6,6 0 0 1 469,623.2969 L13,623.2969 A6,6 0 0 1 7,617.2969 L7,33.2969" fill="#10284A"/><rect fill="none" height="616.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="468" x="7" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="475" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160.7197" x="160.6401" y="24.9951">migrateConfiguration()</text><g class="entity" data-qualified-name="migrateConfiguration.RequestingConversion" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="migrateConfiguration.Previewing" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="316.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="342.5938" y2="342.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="334.292">&#160;</text></g><g class="entity" data-qualified-name="migrateConfiguration.Deciding" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="452.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="478.5938" y2="478.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="470.292">&#160;</text></g><g class="start_entity" data-qualified-name="migrateConfiguration..start.migrateConfiguration" data-source-line="9" id="ent0005"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="migrateConfiguration..end.migrateConfiguration" data-source-line="29" id="ent0009"><ellipse cx="44" cy="599.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="599.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*migrateConfiguration to RequestingConversion--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M44,64.6369 C44,82.8269 44,118.5369 44,144.9069" fill="none" id="*start*migrateConfiguration-to-RequestingConversion" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,149.9069,48,140.9069,44,144.9069,40,140.9069,44,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,121.2969 A6,6 0 0 0 55,127.2969 L398,127.2969 A6,6 0 0 0 404,121.2969 L404,97.2969 L394,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M394,87.2969 L394,94.2969 A3,3 0 0 0 397,97.2969 L404,97.2969 L394,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.916" x="55" y="104.3638">Policy author</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.7778" x="156.0483" y="104.3638">asks to convert a file that names its</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.8369" x="55" y="119.4966">account in a root owner field</text></g><!--link RequestingConversion to Previewing--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.4969 C44,231.5069 44,279.9469 44,310.9969" fill="none" id="RequestingConversion-to-Previewing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,315.9969,48,306.9969,44,310.9969,40,306.9969,44,315.9969" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,287.2969 A6,6 0 0 0 55,293.2969 L445,293.2969 A6,6 0 0 0 451,287.2969 L451,233.2969 L441,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M441,223.2969 L441,230.2969 A3,3 0 0 0 444,233.2969 L451,233.2969 L441,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="292.2461" x="127.5791" y="240.3638">resolves the document and reports what it is</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="368.0815" x="55" y="255.4966">&#8226; a file that already declares owners needs no migration</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="381.7671" x="55" y="270.6294">&#8226; the converted result is equivalent: the same repositories</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171.958" x="63.2646" y="285.7622">resolve to the same policy</text></g><!--link Previewing to Deciding--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="23" id="lnk8"><path d="M44,366.5669 C44,390.8469 44,422.9869 44,447.2069" fill="none" id="Previewing-to-Deciding" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,452.2069,48,443.2069,44,447.2069,40,443.2069,44,452.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,395.2969 L49,423.2969 A6,6 0 0 0 55,429.2969 L426,429.2969 A6,6 0 0 0 432,423.2969 L432,399.2969 L422,389.2969 L55,389.2969 A6,6 0 0 0 49,395.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M422,389.2969 L422,396.2969 A3,3 0 0 0 425,399.2969 L432,399.2969 L422,389.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="406.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.7007" x="127.5791" y="406.3638">prints the converted document and changes</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="277.894" x="55" y="421.4966">nothing, because previewing is the default</text></g><!--link Deciding to *end*migrateConfiguration--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="29" id="lnk10"><path d="M44,502.5769 C44,528.7469 44,564.1469 44,582.9769" fill="none" id="Deciding-to-*end*migrateConfiguration" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,587.9769,48,578.9769,44,582.9769,40,578.9769,44,587.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,531.2969 L49,559.2969 A6,6 0 0 0 55,565.2969 L403,565.2969 A6,6 0 0 0 409,559.2969 L409,535.2969 L399,525.2969 L55,525.2969 A6,6 0 0 0 49,531.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M399,525.2969 L399,532.2969 A3,3 0 0 0 402,535.2969 L409,535.2969 L399,525.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.916" x="55" y="542.3638">Policy author</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="238.8433" x="156.0483" y="542.3638">either keeps the preview, or asks for</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.3438" x="55" y="557.4966">--write to convert the file in place</text></g></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="36" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="130.75" y="748.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="130.75" x2="351.2549" y1="774.5969" y2="774.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="140.75" y="766.2951">CONFIGURATION_RESOLVED</text></g><!--link migrateConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="36" id="lnk12"><path d="M31.17,623.57 C28.73,656.75 36.13,689.04 58,718.3 C67.87,731.5 92.8746,741.3278 125.6746,749.9578" fill="none" id="migrateConfiguration-to-CONFIGURATION_RESOLVED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="130.51,751.23,122.824,745.0716,125.6746,749.9578,120.7884,752.8083,130.51,751.23" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M63,664.3 L63,707.3 A6,6 0 0 0 69,713.3 L367,713.3 A6,6 0 0 0 373,707.3 L373,668.3 L363,658.3 L69,658.3 A6,6 0 0 0 63,664.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M363,658.3 L363,665.3 A3,3 0 0 0 366,668.3 L373,668.3 L363,658.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.1865" x="69" y="675.3669">comments, ordering and formatting survive:</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="266.8301" x="69" y="690.4997">the conversion moves blocks rather than</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.0674" x="69" y="705.6325">re-serializing the document</text></g><!--link migrateConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="43" id="lnk13"><path d="M375.27,623.74 C377.78,633.63 380.03,643.5 382,653.3 C387.68,681.62 398.37,694.5 382,718.3 C373.38,730.83 365.803,738.0257 352.473,745.4157" fill="none" id="migrateConfiguration-to-CONFIGURATION_RESOLVED-1" style="stroke:#A78BFA;stroke-width:2;"/><polygon fill="#A78BFA" points="348.1,747.84,357.9108,746.9746,352.473,745.4157,354.0319,739.9779,348.1,747.84" style="stroke:#A78BFA;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M395.71,664.3 L395.71,707.3 A6,6 0 0 0 401.71,713.3 L685.71,713.3 A6,6 0 0 0 691.71,707.3 L691.71,668.3 L681.71,658.3 L401.71,658.3 A6,6 0 0 0 395.71,664.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M681.71,658.3 L681.71,665.3 A3,3 0 0 0 684.71,668.3 L691.71,668.3 L681.71,658.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="267.3633" x="401.71" y="675.3669">--write refused: the file has uncommitted</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="238.5132" x="401.71" y="690.4997">changes in a git working tree, so the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.8755" x="401.71" y="705.6325">conversion could not be reviewed as a diff</text></g><?plantuml-src ZPJRRXCn48Rlzoc6S0CeWKjGLKKAFQ1AgAd2uQQgAiSxcupYjOFjJLGGKf-5H-D9-EtDcI2gH3bv3j_yyplFn6hJb4ptSSerlvQcDaKHeefCjKmyti-ShMJIuACuIofGvzZ1YvST-b4KH6rk1m-4ZlXRmo6AdI1umJuWyZ3cnlD2U8cOmvDprbActt5m--gEUht-lofQXpJW6R4pV3qTzs-S4Vr0gebJvq_VZFkeE0iK7UcS64bH9OOfJbKagseE934WMMdj6Xj9C2rvvoAvfMMFQ3ObpjcMkL_2EeQJEVUc-fjkgAEhdAypcEVWp0BziGCgdMvgHdk5DfxdpiT0oyGeU2Q-tu-_zjYLyQpA1ofP6uLQBMuWorpYrQqMsGgLabERbGYSUeJ6fDA4MMIX39gVv9W0KJ92aEYyS6fEQzgav2PediK-q6OhGLPaiyt_wZ7tOcCumDpJHK-LdMGUb9gYQ9V6h5KJWBBjAYj5kLAOy81kZPFPuAudceW59JtDcETjzLM_BZdVEWnZ8BdNMtg9lEkt59st1cFDZTAyI_IpA8xUjqHtDho-lFhmPJJuV3MylXzTV1f-_7fnNkpXQbSdTKBYADcdmP9GILCLapyfD7uX2pufjhfcjzOkMMzid0OykgRnu2jRUEu5L596lgVyNNCMMoMFKzy-7xnzz_voSFT4_BLSdYiiiJpPYZN57q5ZqtWIuODYjVhsTavm9vREppAVP-vIoAuiTkR3PJOP5XQXTbcm4wegAgMgDgFy0G00?></g></svg>