"spacing" textLength="254.7061" x="12" y="359.0669">Use the minimum permissions needed.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.4009" x="12" y="374.1997">Store CI credentials as protected secrets.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.5181" x="12" y="389.3325">Rotate or revoke after suspected exposure.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="36" id="ent0025"><path d="M607.52,12 L607.52,55.3984 A6,6 0 0 0 613.52,61.3984 L759.37,61.3984 L763.37,183.32 L767.37,61.3984 L913.23,61.3984 A6,6 0 0 0 919.23,55.3984 L919.23,16 L909.23,6 L613.52,6 A6,6 0 0 0 607.52,12" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M909.23,6 L909.23,13 A3,3 0 0 0 912.23,16 L919.23,16 L909.23,6" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.7461" x="613.52" y="23.0669">0.3.1 reads tokens from the environment.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="264.437" x="613.52" y="38.1997">It has no token field in configuration and</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="290.71" x="613.52" y="53.3325">no machine-readable plan artifact to persist.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="42" id="ent0028"><path d="M1246.23,12 L1246.23,55.3984 A6,6 0 0 0 1252.23,61.3984 L1410.27,61.3984 L1414.27,127.32 L1418.27,61.3984 L1576.3086,61.3984 A6,6 0 0 0 1582.3086,55.3984 L1582.3086,16 L1572.3086,6 L1252.23,6 A6,6 0 0 0 1246.23,12" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M1572.3086,6 L1572.3086,13 A3,3 0 0 0 1575.3086,16 L1582.3086,16 L1572.3086,6" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" length