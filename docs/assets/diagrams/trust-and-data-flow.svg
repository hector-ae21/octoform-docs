F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="254.7061" x="12" y="389.1969">Use the minimum permissions needed.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="269.4009" x="12" y="404.3297">Store CI credentials as protected secrets.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.5181" x="12" y="419.4625">Rotate or revoke after suspected exposure.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="36" id="ent0025"><path d="M607.52,12 L607.52,85.6641 A6,6 0 0 0 613.52,91.6641 L763.25,91.6641 L767.25,213.24 L771.25,91.6641 L920.9741,91.6641 A6,6 0 0 0 926.9741,85.6641 L926.9741,16 L916.9741,6 L613.52,6 A6,6 0 0 0 607.52,12" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M916.9741,6 L916.9741,13 A3,3 0 0 0 919.9741,16 L926.9741,16 L916.9741,6" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="298.4541" x="613.52" y="23.0669">Tokens are read from the environment, never</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.3403" x="613.52" y="38.1997">from configuration and never from a flag.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="297.4131" x="613.52" y="53.3325">A saved plan is machine-readable and carries</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="254.4902" x="613.52" y="68.4653">no credential, but it does name private</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="199.8306" x="613.52" y="83.5981">repositories and their settings.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="44" id="ent0028"><path d="M1253.97,42.13 L1253.97,85.5284 A6,6 0 0 0 1259.97,91.5284 L1418.01,