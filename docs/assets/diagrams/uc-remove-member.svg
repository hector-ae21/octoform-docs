e="stroke:#A78BFA;stroke-width:0.5;"/><path d="M355,87.2969 L355,94.2969 A3,3 0 0 0 358,97.2969 L365,97.2969 L355,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="225.2212" x="125.0464" y="104.3638">names one login to take out of the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="81.0088" x="55" y="119.4966">organisation</text></g><!--link NamingOnePerson to Guarding--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M44,200.4769 C44,237.6469 44,303.4569 44,340.8169" fill="none" id="NamingOnePerson-to-Guarding" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,345.8169,48,336.8169,44,340.8169,40,336.8169,44,345.8169" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,317.2969 A6,6 0 0 0 55,323.2969 L411,323.2969 A6,6 0 0 0 417,317.2969 L417,233.2969 L407,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M407,223.2969 L407,230.2969 A3,3 0 0 0 410,233.2969 L417,233.2969 L407,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="264.6592" x="127.5791" y="240.3638">refuses two people whatever else is true</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.2422" x="55" y="255.4966">&#8226; the only remaining owner, because an organisation</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="338.3364" x="63.2646" y="270.6294">with no owners cannot be administered by anybody</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.8169" x="55" y="285.7622">&#8226; the account this run is authenticated as, because it</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="157.1743" x="63.2646" y="300.895">could not put itself back</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="345.7188" x="55" y="316.0278">Neither is an API error: GitHub performs both happily</text></g><!--link Guarding to Asking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk9"><path d="M44,396.5669 C44,424.2769 44,464.3369 44,492.0369" fill="none" id="Guarding-to-Asking" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,497.0369,48,488.0369,44,492.0369,40,488.0369,44,497.0369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,425.2969 L49,468.2969 A6,6 0 0 0 55,474.2969 L422,474.2969 A6,6 0 0 0 428,468.2969 L428,429.2969 L418,419.2969 L55,419.2969 A6,6 0 0 0 49,425.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M418,419.2969 L418,426.2969 A3,3 0 0 0 421,429.2969 L428,429.2969 L418,419.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="436.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="276.6943" x="127.5791" y="436.3638">says which of the two states it found &#8212; an</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="358.4712" x="55" y="451.4966">active membership, or an invitation never answered &#8212;</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="134.0752" x="55" y="466.6294">and what will be lost</text></g><!--link Asking to Removing--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="33" id="lnk10"><path d="M44,547.6669 C44,568.1969 44,592.4369 44,612.9569" fill="none" id="Asking-to-Removing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,617.9569,48,608.9569,44,612.9569,40,608.9569,44,617.9569" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,576.2969 L49,589.2969 A6,6 0 0 0 55,595.2969 L190,595.2969 A6,6 0 0 0 196,589.2969 L196,580.2969 L186,570.2969 L55,570.2969 A6,6 0 0 0 49,576.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M186,570.2969 L186,577.2969 A3,3 0 0 0 189,580.2969 L196,580.2969 L186,570.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="587.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="56.3101" x="125.0464" y="587.3638">confirms</text></g><!--link Removing to *end*removeMember--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" data-source-line="38" id="lnk12"><path d="M44,668.7469 C44,698.5269 44,742.5069 44,763.8369" fill="none" id="Removing-to-*end*removeMember" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,768.8369,48,759.8369,44,763.8369,40,759.8369,44,768.8369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,697.2969 L49,740.2969 A6,6 0 0 0 55,746.2969 L441,746.2969 A6,6 0 0 0 447,740.2969 L447,701.2969 L437,691.2969 L55,691.2969 A6,6 0 0 0 49,697.2969"