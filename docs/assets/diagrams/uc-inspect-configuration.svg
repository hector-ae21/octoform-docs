<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="812px" preserveAspectRatio="none" style="width:562px;height:812px;" version="1.1" viewBox="0 0 562 812" width="562px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="inspectConfiguration" data-source-line="3" id="ent0001"><path d="M13,7 L503,7 A6,6 0 0 1 509,13 L509,33.2969 L7,33.2969 L7,13 A6,6 0 0 1 13,7" fill="#10284A"/><path d="M7,33.2969 L509,33.2969 L509,617.2969 A6,6 0 0 1 503,623.2969 L13,623.2969 A6,6 0 0 1 7,617.2969 L7,33.2969" fill="#10284A"/><rect fill="none" height="616.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="502" x="7" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="509" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="156.6113" x="179.6943" y="24.9951">inspectConfiguration()</text><g class="entity" data-qualified-name="inspectConfiguration.RequestingResolved" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="inspectConfiguration.Resolving" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="286.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="312.5938" y2="312.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="304.292">&#160;</text></g><g class="entity" data-qualified-name="inspectConfiguration.Presenting" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="452.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="478.5938" y2="478.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="470.292">&#160;</text></g><g class="start_entity" data-qualified-name="inspectConfiguration..start.inspectConfiguration" data-source-line="9" id="ent0005"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="inspectConfiguration..end.inspectConfiguration" data-source-line="29" id="ent0009"><ellipse cx="44" cy="599.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="599.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*inspectConfiguration to RequestingResolved--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk6"><path d="M44,64.6369 C44,82.8269 44,118.5369 44,144.9069" fill="none" id="*start*inspectConfiguration-to-RequestingResolved" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,149.9069,48,140.9069,44,144.9069,40,140.9069,44,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,121.2969 A6,6 0 0 0 55,127.2969 L382,127.2969 A6,6 0 0 0 388,121.2969 L388,97.2969 L378,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M378,87.2969 L378,94.2969 A3,3 0 0 0 381,97.2969 L388,97.2969 L378,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="248.8091" x="125.0464" y="104.3638">asks what a repository will actually be</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="314.9009" x="55" y="119.4966">governed by, rather than inferring it from a plan</text></g><!--link RequestingResolved to Resolving--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M44,200.5669 C44,224.8469 44,256.9869 44,281.2069" fill="none" id="RequestingResolved-to-Resolving" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,286.2069,48,277.2069,44,281.2069,40,277.2069,44,286.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,229.2969 L49,257.2969 A6,6 0 0 0 55,263.2969 L479,263.2969 A6,6 0 0 0 485,257.2969 L485,233.2969 L475,223.2969 L55,223.2969 A6,6 0 0 0 49,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M475,223.2969 L475,230.2969 A3,3 0 0 0 478,233.2969 L485,233.2969 L475,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.7202" x="127.5791" y="240.3638">resolves the selection offline, with the same</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="415.835" x="55" y="255.4966">guarantee validateConfiguration() makes: no token, no network</text></g><!--link Resolving to Presenting--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk8"><path d="M44,336.4969 C44,367.5069 44,415.9469 44,446.9969" fill="none" id="Resolving-to-Presenting" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,451.9969,48,442.9969,44,446.9969,40,442.9969,44,451.9969" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,365.2969 L49,423.2969 A6,6 0 0 0 55,429.2969 L388,429.2969 A6,6 0 0 0 394,423.2969 L394,369.2969 L384,359.2969 L55,359.2969 A6,6 0 0 0 49,365.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M384,359.2969 L384,366.2969 A3,3 0 0 0 387,369.2969 L394,369.2969 L384,359.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="376.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="198.0405" x="127.5791" y="376.3638">prints the final resolved shape</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="236.3296" x="55" y="391.4966">&#8226; which values survived precedence</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="296.3784" x="55" y="406.6294">&#8226; values shaped like credentials are redacted</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.7588" x="55" y="421.7622">&#8226; --format json wraps it in the versioned envelope</text></g><!--link Presenting to *end*inspectConfiguration--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="29" id="lnk10"><path d="M44,502.5769 C44,528.7469 44,564.1469 44,582.9769" fill="none" id="Presenting-to-*end*inspectConfiguration" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,587.9769,48,578.9769,44,582.9769,40,578.9769,44,587.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,531.2969 L49,559.2969 A6,6 0 0 0 55,565.2969 L414,565.2969 A6,6 0 0 0 420,559.2969 L420,535.2969 L410,525.2969 L55,525.2969 A6,6 0 0 0 49,531.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M410,525.2969 L410,532.2969 A3,3 0 0 0 413,535.2969 L420,535.2969 L410,525.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="542.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="280.7886" x="125.0464" y="542.3638">compares the resolved shape against what</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="196.6313" x="55" y="557.4966">they expected to be managed</text></g></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="36" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="147.75" y="748.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="147.75" x2="368.2549" y1="774.5969" y2="774.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="157.75" y="766.2951">CONFIGURATION_RESOLVED</text></g><!--link inspectConfiguration to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" data-link-type="dependency" data-source-line="36" id="lnk12"><path d="M204.78,623.66 C203.74,633.64 202.8,643.54 202,653.3 C199.63,682.09 190.7,691.71 202,718.3 C206.81,729.61 211.6136,736.2896 220.5336,744.6096" fill="none" id="inspectConfiguration-to-CONFIGURATION_RESOLVED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="224.19,748.02,220.3369,738.9561,220.5336,744.6096,214.8802,744.8063,224.19,748.02" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M207,679.3 L207,692.3 A6,6 0 0 0 213,698.3 L258,698.3 A6,6 0 0 0 264,692.3 L264,683.3 L254,