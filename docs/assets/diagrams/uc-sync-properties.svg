-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="157.89" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="293.8267" x="227.9364" y="104.3638">asks for the organisation property schema to</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.582" x="157.89" y="119.4966">match the types the configuration declares</text></g><!--link RequestingSync to Reconciling--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="15" id="lnk7"><path d="M146.89,200.5669 C146.89,228.2769 146.89,268.3369 146.89,296.0369" fill="none" id="RequestingSync-to-Reconciling" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="146.89,301.0369,150.89,292.0369,146.89,296.0369,142.89,292.0369,146.89,301.0369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M151.89,229.2969 L151.89,272.2969 A6,6 0 0 0 157.89,278.2969 L553.89,278.2969 A6,6 0 0 0 559.89,272.2969 L559.89,233.2969 L549.89,223.2969 L157.89,223.2969 A6,6 0 0 0 151.89,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M549.89,223.2969 L549.89,230.2969 A3,3 0 0 0 552.89,233.2969 L559.89,233.2969 L549.89,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="157.89" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.9116" x="230.4691" y="240.3638">compares the declared type values and the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="387.8037" x="157.89" y="255.4966">explicitly declared repository assignments with the schema</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="248.1743" x="157.89" y="270.6294">that the organisation currently carries</text></g><!--link Reconciling to Writing--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="22" id="lnk8"><path d="M146.89,351.4769 C146.89,388.6469 146.89,454.4569 146.89,491.8169" fill="none" id="Reconciling-to-Writing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="146.89,496.8169,150.89,487.8169,146.89,491.8169,142.89,487.8169,146.89,496.8169" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M151.89,380.2969 L151.89,468.2969 A6,6 0 0 0 157.89,474.2969 L546.89,474.2969 A6,6 0 0 0 552.89,468.2969 L552.89,384.2969 L542.89,374.2969 L157.89,374.2969 A6,6 0 0 0 151.89,380.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M542.89,374.2969 L542.89,381.2969 A3,3 0 0 0 545.89,384.2969 L552.89,384.2969 L542.89,374.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="157.89" y="391.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308.1978" x="230.4691" y="391.3638">converges the allowed values and the declared</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="82.3862" x="157.89" y="406.4966">assignments</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.2192" x="157.89" y="421.6294">&#8226; a repository the configuration does not mention</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="183.2441" x="166.1546" y="436.7622">keeps whatever value it has</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.9888" x="157.89" y="451.895">&#8226; an organisation custom-property write needs</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="187.1987" x="166.1546" y="467.0278">admin:org on a classic token</text></g><!--link Writing to *end*syncProperties--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="32" id="lnk10"><path d="M146.89,547.6469 C146.89,569.9469 146.89,596.8569 146.89,613.0369" fill="none" id="Writing-to-*end*syncProperties" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="146.89,618.0369,150.89,609.0369,146.89,613.0369,142.89,609.0369,146.89,618.0369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M151.89,576.2969 L151.89,589.2969 A6,6 0 0 0 157.89,595.2969 L539.89,595.2969 A6,6 0 0 0 545.89,589.2969 L545.89,580.2969 L535.89,570.2969 L157.89,570.2969 A6,6 0 0 0 151.89,576.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M535.89,570.2969 L535.89,577.2969 A3,3 0 0 0 538.89,580.2969 L545.89,580.2969 L535.89,570.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="157.89" y="587.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.0117" x="227.9364" y="587.3638">receives the outcome of each write separately</text></g></g><g class="entity" data-qualified-name="PROPERTY_SCHEMA_SYNCHRONIZED" data-source-line="38" id="ent0011"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="279.7793" x="7" y="778.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="286.7793" y1="804.5969" y2="804.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="259.7793" x="17" y="796.2951">PROPERTY_SCHEMA_SYNCHRONIZED</text></g><g class="entity" data-qualified-name=