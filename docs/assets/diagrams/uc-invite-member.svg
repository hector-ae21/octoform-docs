<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="978px" preserveAspectRatio="none" style="width:514px;height:978px;" version="1.1" viewBox="0 0 514 978" width="514px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="inviteMember" data-source-line="3" id="ent0001"><path d="M13,7 L443,7 A6,6 0 0 1 449,13 L449,33.2969 L7,33.2969 L7,13 A6,6 0 0 1 13,7" fill="#10284A"/><path d="M7,33.2969 L449,33.2969 L449,783.2969 A6,6 0 0 1 443,789.2969 L13,789.2969 A6,6 0 0 1 7,783.2969 L7,33.2969" fill="#10284A"/><rect fill="none" height="782.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="442" x="7" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="449" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="107.5498" x="174.2251" y="24.9951">inviteMember()</text><g class="entity" data-qualified-name="inviteMember.NamingOnePerson" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="165.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="191.5938" y2="191.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="183.292">&#160;</text></g><g class="entity" data-qualified-name="inviteMember.Resolving" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="331.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="357.5938" y2="357.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="349.292">&#160;</text></g><g class="entity" data-qualified-name="inviteMember.Asking" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="482.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="508.5938" y2="508.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="500.292">&#160;</text></g><g class="entity" data-qualified-name="inviteMember.Sending" data-source-line="8" id="ent0005"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="19" y="618.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="19" x2="69" y1="644.5938" y2="644.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="41.7749" y="636.292">&#160;</text></g><g class="start_entity" data-qualified-name="inviteMember..start.inviteMember" data-source-line="10" id="ent0006"><ellipse cx="44" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="inviteMember..end.inviteMember" data-source-line="38" id="ent0011"><ellipse cx="44" cy="765.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="44" cy="765.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*inviteMember to NamingOnePerson--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" data-link-type="dependency" data-source-line="10" id="lnk7"><path d="M44,64.5069 C44,84.9669 44,129.7669 44,159.8969" fill="none" id="*start*inviteMember-to-NamingOnePerson" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,164.8969,48,155.8969,44,159.8969,40,155.8969,44,164.8969" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,93.2969 L49,136.2969 A6,6 0 0 0 55,142.2969 L382,142.2969 A6,6 0 0 0 388,136.2969 L388,97.2969 L378,87.2969 L55,87.2969 A6,6 0 0 0 49,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M378,87.2969 L378,94.2969 A3,3 0 0 0 381,97.2969 L388,97.2969 L378,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="238.2085" x="125.0464" y="104.3638">names one login and, optionally, the</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="318.1953" x="55" y="119.4966">organisation role to offer: admin, direct_member</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="121.5513" x="55" y="134.6294">or billing_manager</text></g><!--link NamingOnePerson to Resolving--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="17" id="lnk8"><path d="M44,215.4969 C44,246.5069 44,294.9469 44,325.9969" fill="none" id="NamingOnePerson-to-Resolving" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,330.9969,48,321.9969,44,325.9969,40,321.9969,44,330.9969" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,244.2969 L49,302.2969 A6,6 0 0 0 55,308.2969 L419,308.2969 A6,6 0 0 0 425,302.2969 L425,248.2969 L415,238.2969 L55,238.2969 A6,6 0 0 0 49,244.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M415,238.2969 L415,245.2969 A3,3 0 0 0 418,248.2969 L425,248.2969 L415,238.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="255.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="256.2549" x="127.5791" y="255.3638">checks whether the person is already a</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="355.3862" x="55" y="270.4966">member or already invited, and stops there if they are</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="323.9844" x="55" y="285.6294">&#8226; an invitation already waiting is reported with its</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="174.4209" x="63.2646" y="300.7622">age rather than sent again</text></g><!--link Resolving to Asking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="25" id="lnk9"><path d="M44,381.5669 C44,409.2769 44,449.3369 44,477.0369" fill="none" id="Resolving-to-Asking" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,482.0369,48,473.0369,44,477.0369,40,473.0369,44,482.0369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,410.2969 L49,453.2969 A6,6 0 0 0 55,459.2969 L400,459.2969 A6,6 0 0 0 406,453.2969 L406,414.2969 L396,404.2969 L55,404.2969 A6,6 0 0 0 49,410.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M396,404.2969 L396,411.2969 A3,3 0 0 0 399,414.2969 L406,414.2969 L396,404.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="421.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="263.9229" x="127.5791" y="421.3638">resolves the login to the numeric user id</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.5684" x="55" y="436.4966">the endpoint takes, and refuses a login no GitHub</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="126.8325" x="55" y="451.6294">account answers to</text></g><!--link Asking to Sending--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="32" id="lnk10"><path d="M44,532.5669 C44,556.8469 44,588.9869 44,613.2069" fill="none" id="Asking-to-Sending" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,618.2069,48,609.2069,44,613.2069,40,609.2069,44,618.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,561.2969 L49,589.2969 A6,6 0 0 0 55,595.2969 L390,595.2969 A6,6 0 0 0 396,589.2969 L396,565.2969 L386,555.2969 L55,555.2969 A6,6 0 0 0 49,561.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M386,555.2969 L386,562.2969 A3,3 0 0 0 389,565.2969 L396,565.2969 L386,555.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="55" y="572.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="256.8008" x="125.0464" y="572.3638">is told who will be invited, as what, and</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="322.4229" x="55" y="587.4966">that they will be emailed about it &#8212; and confirms</text></g><!--link Sending to *end*inviteMember--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" data-source-line="38" id="lnk12"><path d="M44,668.5769 C44,694.7469 44,730.1469 44,748.9769" fill="none" id="Sending-to-*end*inviteMember" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,753.9769,48,744.9769,44,748.9769,40,744.9769,44,753.9769" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,697.2969 L49,725.2969 A6,6 0 0 0 55,731.2969 L399,731.2969 A6,6 0 0 0 405,725.2969 L405,701.2969 L395,691.2969 L55,691.2969 A6,6 0 0 0 49,697.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M395,691.2969 L395,698.2969 A3,3 0 0 0 398,701.2969 L405,701.2969 L395,691.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="708.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="262.4375" x="127.5791" y="708.3638">sends exactly one invitation and reports</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="82.5195" x="55" y="723.4966">the outcome</text></g></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="45" id="ent0013"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="117.75" y="914.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="117.75" x2="338.2549" y1="940.5969" y2="940.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="127.75" y="932.2951">CONFIGURATION_RESOLVED</text></g><!--link inviteMember to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="45" id="lnk14"><path d="M228,789.55 C228,842.58 228,882.74 228,908.96" fill="none" id="inviteMember-to-CONFIGURATION_RESOLVED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="228,913.96,232,904.96,228,908.96,224,904.96,228,913.96" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M233,830.3 L233,873.3 A6,6 0 0 0 239,879.3 L493,879.3 A6,6 0 0 0 499,873.3 L499,834.3 L489,824.3 L239,824.3 A6,6 0 0 0 233,830.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M489,824.3 L489,831.3 A3,3 0 0 0 492,834.3 L499,834.3 L489,824.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.