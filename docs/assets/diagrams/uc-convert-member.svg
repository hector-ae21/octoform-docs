ount this run is</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="55" y="270.6294">authenticated as &#8212; because leaving the organisation</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.4272" x="55" y="285.7622">is what this does, even though access remains</text></g><!--link Guarding to Asking--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="24" id="lnk9"><path d="M44,366.5669 C44,394.2769 44,434.3369 44,462.0369" fill="none" id="Guarding-to-Asking" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="44,467.0369,48,458.0369,44,462.0369,40,458.0369,44,467.0369" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M49,395.2969 L49,438.2969 A6,6 0 0 0 55,444.2969 L402,444.2969 A6,6 0 0 0 408,438.2969 L408,399.2969 L398,389.2969 L55,389.2969 A6,6 0 0 0 49,395.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M398,389.2969 L398,396.2969 A3,3 0 0 0 401,399.2969 L408,399.2969 L398,389.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="55" y="406.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="265.5542" x="127.5791" y="406.3638">refuses somebody who is not a member,</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.8589" x="55" y="421.4966">and reports somebody who is already an outside</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="256.7563" x="55" y="436.6294">collaborator without changing anything</text></g><!--link Asking to Converting--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="depe