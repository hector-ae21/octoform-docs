<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="948px" preserveAspectRatio="none" style="width:718px;height:948px;" version="1.1" viewBox="0 0 718 948" width="718px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="applyPlan" data-source-line="3" id="ent0001"><path d="M21.98,7 L483.98,7 A6,6 0 0 1 489.98,13 L489.98,33.2969 L15.98,33.2969 L15.98,13 A6,6 0 0 1 21.98,7" fill="#10284A"/><path d="M15.98,33.2969 L489.98,33.2969 L489.98,768.2969 A6,6 0 0 1 483.98,774.2969 L21.98,774.2969 A6,6 0 0 1 15.98,768.2969 L15.98,33.2969" fill="#10284A"/><rect fill="none" height="767.2969" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="474" x="15.98" y="7"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="15.98" x2="489.98" y1="33.2969" y2="33.2969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="79.2354" x="213.3623" y="24.9951">applyPlan()</text><g class="entity" data-qualified-name="applyPlan.RequestingApply" data-source-line="5" id="ent0002"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="27.98" y="150.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="27.98" x2="77.98" y1="176.5938" y2="176.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="50.7549" y="168.292">&#160;</text></g><g class="entity" data-qualified-name="applyPlan.Presenting" data-source-line="6" id="ent0003"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="27.98" y="286.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="27.98" x2="77.98" y1="312.5938" y2="312.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="50.7549" y="304.292">&#160;</text></g><g class="entity" data-qualified-name="applyPlan.Confirming" data-source-line="7" id="ent0004"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="27.98" y="422.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="27.98" x2="77.98" y1="448.5938" y2="448.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="50.7549" y="440.292">&#160;</text></g><g class="entity" data-qualified-name="applyPlan.Executing" data-source-line="8" id="ent0005"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="50" x="27.98" y="558.2969"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="27.98" x2="77.98" y1="584.5938" y2="584.5938"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="50.7549" y="576.292">&#160;</text></g><g class="start_entity" data-qualified-name="applyPlan..start.applyPlan" data-source-line="10" id="ent0006"><ellipse cx="52.98" cy="54.2969" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name="applyPlan..end.applyPlan" data-source-line="34" id="ent0011"><ellipse cx="52.98" cy="750.2969" fill="none" rx="11" ry="11" style="stroke:#A78BFA;stroke-width:1;"/><ellipse cx="52.98" cy="750.2969" fill="#222222" rx="6" ry="6" style="stroke:#A78BFA;stroke-width:1;"/></g><!--link *start*applyPlan to RequestingApply--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" data-link-type="dependency" data-source-line="10" id="lnk7"><path d="M52.98,64.6369 C52.98,82.8269 52.98,118.5369 52.98,144.9069" fill="none" id="*start*applyPlan-to-RequestingApply" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="52.98,149.9069,56.98,140.9069,52.98,144.9069,48.98,140.9069,52.98,149.9069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M57.98,93.2969 L57.98,121.2969 A6,6 0 0 0 63.98,127.2969 L396.98,127.2969 A6,6 0 0 0 402.98,121.2969 L402.98,97.2969 L392.98,87.2969 L63.98,87.2969 A6,6 0 0 0 57.98,93.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M392.98,87.2969 L392.98,94.2969 A3,3 0 0 0 395.98,97.2969 L402.98,97.2969 L392.98,87.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="63.98" y="104.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="254.833" x="134.0264" y="104.3638">asks to converge a selection they have</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.3481" x="63.98" y="119.4966">already planned and understood</text></g><!--link RequestingApply to Presenting--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="16" id="lnk8"><path d="M52.98,200.5669 C52.98,224.8469 52.98,256.9869 52.98,281.2069" fill="none" id="RequestingApply-to-Presenting" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="52.98,286.2069,56.98,277.2069,52.98,281.2069,48.98,277.2069,52.98,286.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M57.98,229.2969 L57.98,257.2969 A6,6 0 0 0 63.98,263.2969 L434.98,263.2969 A6,6 0 0 0 440.98,257.2969 L440.98,233.2969 L430.98,223.2969 L63.98,223.2969 A6,6 0 0 0 57.98,229.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M430.98,223.2969 L430.98,230.2969 A3,3 0 0 0 433.98,233.2969 L440.98,233.2969 L430.98,223.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="63.98" y="240.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.9673" x="136.5591" y="240.3638">plans again and displays the result, because</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="351.9648" x="63.98" y="255.4966">the state it observed a moment ago may have moved</text></g><!--link Presenting to Confirming--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="22" id="lnk9"><path d="M52.98,336.5669 C52.98,360.8469 52.98,392.9869 52.98,417.2069" fill="none" id="Presenting-to-Confirming" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="52.98,422.2069,56.98,413.2069,52.98,417.2069,48.98,413.2069,52.98,422.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M57.98,365.2969 L57.98,393.2969 A6,6 0 0 0 63.98,399.2969 L459.98,399.2969 A6,6 0 0 0 465.98,393.2969 L465.98,369.2969 L455.98,359.2969 L63.98,359.2969 A6,6 0 0 0 57.98,365.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M455.98,359.2969 L455.98,366.2969 A3,3 0 0 0 458.98,369.2969 L465.98,369.2969 L455.98,359.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="63.98" y="376.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="297.5972" x="136.5591" y="376.3638">asks for confirmation of exactly the displayed</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="387.3149" x="63.98" y="391.4966">operations, and treats any answer other than y as a refusal</text></g><!--link Confirming to Executing--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="28" id="lnk10"><path d="M52.98,472.5669 C52.98,496.8469 52.98,528.9869 52.98,553.2069" fill="none" id="Confirming-to-Executing" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="52.98,558.2069,56.98,549.2069,52.98,553.2069,48.98,549.2069,52.98,558.2069" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M57.98,501.2969 L57.98,529.2969 A6,6 0 0 0 63.98,535.2969 L403.98,535.2969 A6,6 0 0 0 409.98,529.2969 L409.98,505.2969 L399.98,495.2969 L63.98,495.2969 A6,6 0 0 0 57.98,501.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M399.98,495.2969 L399.98,502.2969 A3,3 0 0 0 402.98,505.2969 L409.98,505.2969 L399.98,495.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="65.9141" x="63.98" y="512.3638">Operator</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="261.5996" x="134.0264" y="512.3638">authorizes that run only; confirmation is</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="171.1074" x="63.98" y="527.4966">never a standing approval</text></g><!--link Executing to *end*applyPlan--><g class="link" data-entity-1="ent0005" data-entity-2="ent0011" data-link-type="dependency" data-source-line="34" id="lnk12"><path d="M52.98,608.6469 C52.98,645.3969 52.98,708.4769 52.98,734.1469" fill="none" id="Executing-to-*end*applyPlan" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="52.98,739.1469,56.98,730.1469,52.98,734.1469,48.98,730.1469,52.98,739.1469" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M57.98,637.2969 L57.98,710.2969 A6,6 0 0 0 63.98,716.2969 L457.98,716.2969 A6,6 0 0 0 463.98,710.2969 L463.98,641.2969 L453.98,631.2969 L63.98,631.2969 A6,6 0 0 0 57.98,637.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M453.98,631.2969 L453.98,638.2969 A3,3 0 0 0 456.98,641.2969 L463.98,641.2969 L453.98,631.2969" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4468" x="63.98" y="648.3638">Octoform</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.2759" x="136.5591" y="648.3638">attempts each independent endpoint group and</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="221.6411" x="63.98" y="663.4966">reports every outcome separately</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.5503" x="63.98" y="678.6294">&#8226; a default-branch rename runs before resources</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="131.4917" x="72.2446" y="693.7622">that name branches</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="295.4644" x="63.98" y="708.895">&#8226; a failure does not roll back what succeeded</text></g></g><g class="entity" data-qualified-name="CHANGES_APPLIED" data-source-line="44" id="ent0013"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="153.9502" x="7" y="884.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="7" x2="160.9502" y1="910.5969" y2="910.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="133.9502" x="17" y="902.2951">CHANGES_APPLIED</text></g><g class="entity" data-qualified-name="CONFIGURATION_RESOLVED" data-source-line="49" id="ent0015"><rect fill="#10284A" height="50" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5049" x="311.72" y="884.3"/><line style="stroke:#38BDF8;stroke-width:0.5;" x1="311.72" x2="532.2249" y1="910.5969" y2="910.5969"/><text fill="#F8FAFC" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.5049" x="321.72" y="902.2951">CONFIGURATION_RESOLVED</text></g><!--link applyPlan to CHANGES_APPLIED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0013" data-link-type="dependency" data-source-line="44" id="lnk14"><path d="M87.54,774.76 C85.13,784.64 82.94,794.5 80.98,804.3 C75.59,831.22 77.0594,857.8762 79.6294,879.1162" fill="none" id="applyPlan-to-CHANGES_APPLIED" style="stroke:#67E8F9;stroke-width:2;"/><polygon fill="#67E8F9" points="80.23,884.08,83.1199,874.6647,79.6294,879.1162,75.1779,875.6257,80.23,884.08" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M85.98,822.8 L85.98,835.8 A6,6 0 0 0 91.98,841.8 L367.98,841.8 A6,6 0 0 0 373.98,835.8 L373.98,826.8 L363.98,816.8 L91.98,816.8 A6,6 0 0 0 85.98,822.8" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M363.98,816.8 L363.98,823.8 A3,3 0 0 0 366.98,826.8 L373.98,826.8 L363.98,816.8" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="267.1475" x="91.98" y="833.8669">everything requested was applied; exit 0</text></g><!--link applyPlan to CONFIGURATION_RESOLVED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0015" data-link-type="dependency" data-source-line="49" id="lnk16"><path d="M378.23,774.58 C393.37,820.85 404.6553,855.3579 412.4353,879.1379" fill="none" id="applyPlan-to-CONFIGURATION_RESOLVED" style="stroke:#A78BFA;stroke-width:2;"/><polygon fill="#A78BFA" points="413.99,883.89,414.9932,874.0924,412.4353,879.1379,407.3898,876.5799,413.99,883.89" style="stroke:#A78BFA;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M406.04,815.3 L406.04,843.3 A6,6 0 0 0 412.04,849.3 L697.04,849.3 A6,6 0 0 0 703.04,843.3 L703.04,819.3 L693.04,809.3 L412.04,809.3 A6,6 0 0 0 406.04,815.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M693.04,809.3 L693.04,816.3 A3,3 0 0 0 696.04,819.3 L703.04,819.3 L693.04,809.3" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FA