<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="911px" preserveAspectRatio="none" style="width:585px;height:911px;" version="1.1" viewBox="0 0 585 911" width="585px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><ellipse cx="141.7549" cy="25" fill="#67E8F9" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#10284A" height="47.9375" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="220.5254" x="31.4922" y="55"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="200.5254" x="41.4922" y="76.1387">Collect every owner-level change</text><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="109.9453" x="41.4922" y="90.1074">the plan produced</text><path d="M266.75,112.9375 L266.75,136.6367 L246.75,140.6367 L266.75,144.6367 L266.75,168.3359 A0,0 0 0 0 266.75,168.3359 L516.8369,168.3359 A0,0 0 0 0 516.8369,168.3359 L516.8369,122.9375 L506.8369,112.9375 L266.75,112.9375 A0,0 0 0 0 266.75,112.9375" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M506.8369,112.9375 L506.8369,122.9375 L516.8369,122.9375 L506.8369,112.9375" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.3584" x="272.75" y="130.0044">A change carries its prerequisites.</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0869" x="272.75" y="145.1372">Nothing infers them from the order</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.9512" x="272.75" y="160.27">the file happens to be written in.</text><rect fill="#10284A" height="33.9688" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="209.9902" x="36.7598" y="123.6523"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="189.9902" x="46.7598" y="144.791">Record what each one waits for</text><path d="M231.8779,235.6558 L231.8779,266.9214 L211.8779,270.9214 L231.8779,274.9214 L231.8779,306.187 A0,0 0 0 0 231.8779,306.187 L478.7275,306.187 A0,0 0 0 0 478.7275,306.187 L478.7275,245.6558 L468.7275,235.6558 L231.8779,235.6558 A0,0 0 0 0 231.8779,235.6558" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M468.7275,235.6558 L468.7275,245.6558 L478.7275,245.6558 L468.7275,235.6558" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="196.0156" x="237.8779" y="252.7227">A parent that already exists is</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="214.9824" x="237.8779" y="267.8555">nothing to wait for. A parent that</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="225.8496" x="237.8779" y="282.9883">was never declared is a mistake in</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="193.083" x="237.8779" y="298.1211">the file, and is named as one.</text><rect fill="#10284A" height="33.9688" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="140.2461" x="71.6318" y="253.937"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="120.2461" x="81.6318" y="275.0757">Report it as blocked</text><ellipse cx="141.7549" cy="337.187" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="141.7549" cy="337.187" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#173B69" points="52.1785,188.3359,231.3313,188.3359,243.3313,201.1406,231.3313,213.9453,52.1785,213.9453,40.1785,201.1406,52.1785,188.3359" style="stroke:#A78BFA;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="145.7549" y="224.1558">yes</text><text fill="#F8FAFC" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="179.1528" x="52.1785" y="198.5464">Does anything wait for a change</text><text fill="#F8FAFC" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="121.0269" x="52.1785" y="211.3511">that is not in this run?</text><text fill="#DDEBFF" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="243.3313" y="198.5464">no</text><rect fill="#10284A" height="47.9375" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="251.5098" x="16" y="434.187"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="231.5098" x="26" y="455.3257">Take the changes whose prerequisites</text><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="115.5293" x="26" y="469.2944">have all succeeded</text><rect fill="#10284A" height="33.9688" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="104.2109" x="89.6494" y="502.1245"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="84.2109" x="99.6494" y="523.2632">Attempt them</text><path d="M274.4609,601.8037 L274.4609,633.0693 L254.4609,637.0693 L274.4609,641.0693 L274.4609,672.335 A0,0 0 0 0 274.4609,672.335 L522.1865,672.335 A0,0 0 0 0 522.1865,672.335 L522.1865,611.8037 L512.1865,601.8037 L274.4609,601.8037 A0,0 0 0 0 274.4609,601.8037" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><path d="M512.1865,601.8037 L512.1865,611.8037 L522.1865,611.8037 L512.1865,601.8037" fill="#18223C" style="stroke:#A78BFA;stroke-width:0.5;"/><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.7256" x="280.4609" y="618.8706">Blocked, not attempted. Sending a</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="206.8511" x="280.4609" y="634.0034">child team to sit under a parent</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.0391" x="280.4609" y="649.1362">that does not exist would fail in a</text><text fill="#F8FAFC" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="167.1909" x="280.4609" y="664.269">way nobody asked about.</text><rect fill="#10284A" height="33.9688" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="225.4121" x="29.0488" y="620.085"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="205.4121" x="39.0488" y="641.2236">Block everything that waited for it</text><polygon fill="#173B69" points="79.3831,556.0933,204.1267,556.0933,216.1267,568.0933,204.1267,580.0933,79.3831,580.0933,67.3831,568.0933,79.3831,556.0933" style="stroke:#A78BFA;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#DDEBFF" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="145.7549" y="590.3037">yes</text><text fill="#F8FAFC" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="124.7437" x="79.3831" y="571.9014">Did a prerequisite fail?</text><text fill="#DDEBFF" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="216.1267" y="565.499">no</text><polygon fill="#173B69" points="141.7549,692.335,153.7549,704.335,141.7549,716.335,129.7549,704.335,141.7549,692.335" style="stroke:#A78BFA;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#173B69" points="141.7549,390.187,153.7549,402.187,141.7549,414.187,129.7549,402.187,141.7549,390.187" style="stroke:#A78BFA;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#173B69" points="39.5671,736.335,243.9426,736.335,255.9426,748.335,243.9426,760.335,39.5671,760.335,27.5671,748.335,39.5671,736.335" style="stroke:#A78BFA;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#F8FAFC" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="204.3755" x="39.5671" y="752.1431">Anything left that can be attempted?</text><text fill="#DDEBFF" font-family="Arial" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="255.9426" y="745.7407">yes</text><rect fill="#10284A" height="47.9375" rx="6" ry="6" style="stroke:#38BDF8;stroke-width:0.5;" width="240.3008" x="21.6045" y="801.7339"/><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="220.3008" x="31.6045" y="822.8726">Report every outcome, including the</text><text fill="#F8FAFC" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="195.2871" x="31.6045" y="836.8413">ones that were never attempted</text><ellipse cx="141.7549" cy="880.6714" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="141.7549" cy="880.6714" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="35" y2="55"/><polygon fill="#67E8F9" points="137.7549,45,141.7549,55,145.7549,45,141.7549,49" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="102.9375" y2="123.6523"/><polygon fill="#67E8F9" points="137.7549,113.6523,141.7549,123.6523,145.7549,113.6523,141.7549,117.6523" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="287.9058" y2="326.187"/><polygon fill="#67E8F9" points="137.7549,316.187,141.7549,326.187,145.7549,316.187,141.7549,320.187" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="213.9453" y2="253.937"/><polygon fill="#67E8F9" points="137.7549,243.937,141.7549,253.937,145.7549,243.937,141.7549,247.937" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="243.3313" x2="488.7275" y1="201.1406" y2="201.1406"/><polygon fill="#67E8F9" points="484.7275,286.019,488.7275,296.019,492.7275,286.019,488.7275,290.019" style="stroke:#67E8F9;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="488.7275" x2="488.7275" y1="201.1406" y2="370.187"/><line style="stroke:#67E8F9;stroke-width:2;" x1="488.7275" x2="141.7549" y1="370.187" y2="370.187"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="370.187" y2="390.187"/><polygon fill="#67E8F9" points="137.7549,380.187,141.7549,390.187,145.7549,380.187,141.7549,384.187" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="157.6211" y2="188.3359"/><polygon fill="#67E8F9" points="137.7549,178.3359,141.7549,188.3359,145.7549,178.3359,141.7549,182.3359" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="482.1245" y2="502.1245"/><polygon fill="#67E8F9" points="137.7549,492.1245,141.7549,502.1245,145.7549,492.1245,141.7549,496.1245" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="141.7549" x2="141.7549" y1="580.0933" y2="620.085"/><polygon fill="#67E8F9" points="137.7549,610.085,141.7549,620.085,145.7549,610.085,141.7549,614.085" style="stroke:#67E8F9;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#67E8F9;stroke-width:2;" x1="216.1267" x2="532.1865" y1="568.0933" y2="568.0933"/><polygon fill="#67E8F9" points="528.1865,627.0693,532.1865,637.0693,536.1865,627.0693,532.1865,631.0693" style="stroke:#67E8F9;stroke-width:2;strok